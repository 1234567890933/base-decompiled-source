    <style>
      :root {
        --bg: #171717;
        --text: #FFFFFF;
        --green: #0AB963;
        --green-text: #171717;
        --coach-text: #0AB963;
        --coach-bg: #16271f;
        --font-body: 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, Inter, sans-serif;
        --font-title: 'Montserrat', 'Nunito Sans', sans-serif;

        /* Zip palette — mirrors ZIP_COLORS in zipPuzzleConstants.ts */
        --z-board: #1c1c1e;
        --z-grid: #5a5a5e;
        --z-border: #6e6e73;
        --z-wall: #e8e8e8;
        --z-hole: #2a2a2c;
        --z-hole-border: #9a9a9e;
        --z-path: #6fcf97;
        --z-cell-fill: rgba(111, 207, 151, 0.34);
        --z-win: #2e8b57;
        --z-win-trace: #044e2a;
        --z-num: #101012;
        --coach-warn: #ee362a;
        --hand: #8e7ee0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        overflow: hidden;
        font-weight: 700;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      .stage {
        position: relative;
        height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        display: flex;
        flex-direction: column;
        /* Fixed top inset so coach text sits 140px from the WebView top on every step. */
        padding: 140px 18px 32px;
      }

      /* Content area — top-aligned so the 140px stage padding is consistent across steps. */
      .content {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 26px;
        min-height: 0;
      }

      /* Coach caption */
      .coach-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 280px;
        width: 100%;
        flex-shrink: 0;
      }
      .coach {
        width: 100%;
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.35;
        color: var(--coach-text);
        background: var(--coach-bg);
        border-radius: 10px;
        padding: 12px 16px;
        opacity: 0;
        transform: translateY(4px);
        transition:
          opacity 200ms ease,
          transform 200ms ease;
      }
      .coach.is-on {
        opacity: 1;
        transform: none;
      }
      .coach-text {
        min-height: 20px;
      }
      .coach-text .word {
        display: inline-block;
        white-space: nowrap;
      }
      .coach-text .char {
        display: inline-block;
        opacity: 0;
        animation: coachCharIn 90ms ease-out forwards;
      }
      @keyframes coachCharIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Error line under the coach — reserved height so warns don't shift the board. */
      .coach-sub {
        display: flex;
        width: 100%;
        min-height: 18px;
        text-align: left;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.35;
        color: var(--coach-warn);
        align-items: center;
        justify-content: center;
        gap: 6px;
        visibility: hidden;
      }
      .coach-sub.is-on {
        visibility: visible;
      }
      .coach-sub.warn {
        visibility: visible;
        animation: coachWarnIn 220ms ease-out;
      }
      .coach-sub.warn::before {
        content: '!';
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--coach-warn);
        color: #171717;
        font-size: 10px;
        font-weight: 800;
        line-height: 1;
        flex-shrink: 0;
      }
      .coach-sub .warn-text {
        white-space: nowrap;
        max-width: none;
      }
      @keyframes coachWarnIn {
        from {
          opacity: 0.25;
        }
        to {
          opacity: 1;
        }
      }

      /* ---- Zip board --------------------------------------------------- */
      .z-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: visible;
      }
      .z-wrap.has-hand {
        /* Room for the sliding drag-hand below the 1×N board. */
        margin: 0 24px 56px;
      }
      .board-slot {
        position: relative;
        display: inline-block;
        overflow: visible;
      }
      .zframe {
        display: inline-block;
        background: var(--z-board);
        border: 2px solid var(--z-border);
        line-height: 0;
        transition:
          background 500ms ease,
          border-color 500ms ease;
      }
      .zframe.nogrid {
        background: transparent;
        border-color: transparent;
      }
      .zgrid {
        position: relative;
        display: grid;
        touch-action: none;
      }
      .zcell {
        position: relative;
        border: 0 solid var(--z-grid);
        transition:
          background 120ms ease,
          border-color 500ms ease;
      }
      /* Internal grid lines only (last column/row get none) so the outer
         boundary is just the rounded frame — no double border at the edges. */
      .zcell.br {
        border-right-width: 1.5px;
      }
      .zcell.bb {
        border-bottom-width: 1.5px;
      }
      .zframe.nogrid .zcell {
        border-color: transparent;
      }
      /* The green visual is the rounded snake pill only — no square per-cell
         fill, otherwise the cell squares poke out past the rounded caps/joins
         and the path reads with square corners/ends. */
      .zsnake {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 2;
      }
      .zsnake polyline,
      .zsnake path {
        fill: none;
        stroke: var(--z-path);
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .zsnake path.zwin-trace {
        stroke: var(--z-win-trace);
      }
      .zframe.zsolved {
        border-color: transparent;
      }
      .zframe.zsolved .zcell {
        border-color: transparent;
      }
      .znum {
        position: absolute;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--z-num);
        color: #FFFFFF;
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        line-height: 1;
        pointer-events: none;
        transition:
          background 140ms ease,
          color 140ms ease;
      }
      .znum.on {
        background: #FFFFFF;
        color: var(--z-num);
      }

      /* Drag hint: purple hand that slides L→R (patches-style). */
      .drag-hint {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        opacity: 1;
        transition: opacity 180ms ease;
      }
      .drag-hint.is-off {
        opacity: 0;
      }
      .drag-hand {
        position: absolute;
        z-index: 1;
      }
      .drag-hand-inner {
        transform-origin: 30% 20%;
      }
      .drag-hand.is-h .drag-hand-inner {
        animation: handDragH 2.4s ease-in-out infinite;
      }
      .drag-hand svg {
        display: block;
        width: 100%;
        height: auto;
      }
      @keyframes handDragH {
        0%,
        8% {
          transform: translateX(0);
        }
        48%,
        58% {
          transform: translateX(var(--hand-travel, 80px));
        }
        100% {
          transform: translateX(0);
        }
      }

      /* Teaching arrow: dotted line pointing into the next cell (step 6). */
      .cell-arrow {
        position: absolute;
        z-index: 4;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: opacity 180ms ease;
      }
      .cell-arrow svg {
        display: block;
        overflow: visible;
      }

      /* Footer continue button (static steps) */
      .footer {
        flex: 0 0 auto;
        padding-top: 12px;
      }
      .btn-continue {
        width: 100%;
        height: 54px;
        border: none;
        border-radius: 12px;
        background: var(--green);
        color: var(--green-text);
        font-family: 'Nunito Sans';
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        cursor: pointer;
        display: none;
      }
      .btn-continue.is-on {
        display: block;
      }
      .btn-continue:active {
        transform: translateY(1px);
      }
    </style>

      (function () {

        var NUMS_4x4 = [

            ],
            errors: {

              fillAll: 'Make sure you fill all the cells.',
            },
          },
        ];

        var els = {
          coachStack: document.getElementById('coach-stack'),
          coach: document.getElementById('coach'),
          coachText: document.getElementById('coach-text'),
          coachSub: document.getElementById('coach-sub'),
          boardHost: document.getElementById('board-host'),
          continue: document.getElementById('continue'),
          handTemplate: document.getElementById('drag-hand-template'),
        };

        var stepIndex = 0;
        var TYPE_SPEED = 15;
        var typingTimer = null;
        var coachState = 'idle';
        var interactiveDone = false;
        var advanceTimer = null;

        function postToHost(msg) {
          try {
            var payload = JSON.stringify(msg);
            if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
              window.ReactNativeWebView.postMessage(payload);
            } else if (window.parent && window.parent !== window) {
              window.parent.postMessage(payload, '*');
            }
          } catch (e) {}
        }

        // ---- Coach typewriter ----------------------------------------------
        function clearTyping() {
          if (typingTimer) {
            clearTimeout(typingTimer);
            typingTimer = null;
          }
        }

        function typewrite(el, text, onDone) {
          clearTyping();
          coachState = 'typing';
          el.textContent = text || '';
          var totalChars = 0;
          var children = Array.prototype.slice.call(el.childNodes);
          children.forEach(function (child) {
            if (child.nodeType !== 3) return;
            var frag = document.createDocumentFragment();
            var words = child.nodeValue.split(' ');
            words.forEach(function (word, wIdx) {
              if (word.length > 0) {
                var wordSpan = document.createElement('span');
                wordSpan.className = 'word';
                for (var i = 0; i < word.length; i++) {
                  var charSpan = document.createElement('span');
                  charSpan.className = 'char';
                  charSpan.style.animationDelay = totalChars * TYPE_SPEED + 'ms';
                  charSpan.textContent = word.charAt(i);
                  wordSpan.appendChild(charSpan);
                  totalChars += 1;
                }
                frag.appendChild(wordSpan);
              }
              if (wIdx < words.length - 1) {
                frag.appendChild(document.createTextNode(' '));
                totalChars += 1;
              }
            });
            el.replaceChild(frag, child);
          });
          var done = function () {
            typingTimer = null;
            if (onDone) onDone();
          };
          if (totalChars === 0) {
            done();
            return;
          }
          typingTimer = setTimeout(done, totalChars * TYPE_SPEED + 90);
        }

        function completeTyping() {
          clearTyping();
          var step = STEPS[stepIndex];
          if (step) els.coachText.textContent = step.text || '';
          coachState = 'done';
        }

        function handleScreenTap() {
          if (coachState === 'typing') completeTyping();
        }

        function lockCoachSize(text) {
          els.coach.style.minWidth = '';
          els.coach.style.minHeight = '';
          els.coachText.textContent = text || '';
          void els.coach.offsetWidth;
          var capH = els.coach.offsetHeight || 60;
          var capW = els.coach.offsetWidth || 200;
          els.coach.style.minWidth = capW + 'px';
          els.coach.style.minHeight = capH + 'px';
          els.coachText.textContent = '';
        }

        function measureCoachStackHeight(text) {
          els.coach.style.minWidth = '';
          els.coach.style.minHeight = '';
          els.coachText.textContent = text || '';
          els.coachSub.classList.add('is-on');
          els.coachSub.textContent = '';
          void els.coachStack.offsetWidth;
          var h = els.coachStack.offsetHeight || 0;
          els.coachText.textContent = '';
          els.coachSub.classList.remove('is-on');
          return h;
        }

        function lockCoachStackSize() {
          var maxH = 0;
          STEPS.forEach(function (step) {
            if (!step.text) return;
            var h = measureCoachStackHeight(step.text);
            if (h > maxH) maxH = h;
          });
          els.coachStack.style.minHeight = (maxH || 64) + 'px';
        }

        function clearCoachWarn() {
          els.coachSub.classList.remove('warn');
          els.coachSub.textContent = '';
        }

        function flashCoachWarn(msg) {
          if (!msg) return;
          clearCoachWarn();
          els.coachSub.classList.add('is-on', 'warn');
          var text = document.createElement('span');
          text.className = 'warn-text';
          text.textContent = msg;
          els.coachSub.appendChild(text);
          // Stay visible until cleared (solve / step change) — no auto-dismiss.
        }

        function showCoachCaption(step) {
          coachState = 'idle';
          lockCoachSize(step.text);
          clearCoachWarn();
          // Keep sub line in-flow on error steps so flashing a warn never shifts layout.
          if (step.reserveSub || step.errors) {
            els.coachSub.classList.add('is-on');
          } else {
            els.coachSub.classList.remove('is-on');
          }
          els.coachSub.classList.remove('warn');
          els.coachSub.textContent = '';
          requestAnimationFrame(function () {
            els.coach.classList.add('is-on');
            typewrite(els.coachText, step.text, function () {
              coachState = 'done';
            });
          });
        }

        function postHaptic(style) {
          postToHost({ type: 'haptic', style: style || 'Soft' });
        }

        // ---- Drag hint (patches-style sliding hand) -----------------------
        function makeDragHint(step) {
          var hint = step.dragHint;
          if (!hint) return null;
          var SIZE = step.size;
          var C = step.C;
          var layer = document.createElement('div');
          layer.className = 'drag-hint';
          var uid = Math.random().toString(36).slice(2, 8);
          var hand = els.handTemplate.content.firstElementChild.cloneNode(true);
          hand.classList.add('is-h');
          var mask = hand.querySelector('mask');
          if (mask) {
            var mid = 'dragHandOutline-' + uid;
            mask.setAttribute('id', mid);
            var masked = hand.querySelector('path[mask]');
            if (masked) masked.setAttribute('mask', 'url(#' + mid + ')');
          }
          var handW = SIZE * HAND.widthRatio;
          hand.style.width = handW + 'px';
          var hc = hint.handCell || { r: 0, c: 0 };
          hand.style.left = hc.c * SIZE + SIZE * 0.12 + 'px';
          hand.style.top = (hc.r + 1) * SIZE + SIZE * 0.02 + 'px';
          hand.style.setProperty('--hand-travel', (C - 1) * SIZE * 0.92 + 'px');
          layer.appendChild(hand);
          return {
            layer: layer,
            hide: function () {
              layer.classList.add('is-off');
            },
          };
        }

        // Dotted arrow from a cell into its neighbor (step 6 teaching cue).
        function makeCellArrow(step) {
          var arrow = step.cellArrow;
          if (!arrow) return null;
          var SIZE = step.size;
          var from = arrow.from;
          var el = document.createElement('div');
          el.className = 'cell-arrow';
          var h = Math.round(SIZE * 0.52);
          var w = 14;
          // Sit on the top edge of `from`, pointing into the cell above.
          el.style.left = from.c * SIZE + SIZE / 2 - w / 2 + 'px';
          el.style.top = from.r * SIZE - h + SIZE * 0.1 + 'px';
          el.style.width = w + 'px';
          el.style.height = h + 'px';
          el.innerHTML =
            '<svg width="' +
            w +
            '" height="' +
            h +
            '" viewBox="0 0 ' +
            w +
            ' ' +
            h +
            '" fill="none" xmlns="http://www.w3.org/2000/svg">' +
            '<line x1="' +
            w / 2 +
            '" y1="' +
            (h - 2) +
            '" x2="' +
            w / 2 +
            '" y2="10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 4"/>' +
            '<path d="M' +
            w / 2 +
            ' 2 L' +
            (w / 2 - 5) +
            ' 10 L' +
            (w / 2 + 5) +
            ' 10 Z" fill="#FFFFFF"/>' +
            '</svg>';
          return el;
        }

        // ---- Zip board renderer --------------------------------------------
        function renderZip(step) {
          interactiveDone = false;
          var R = step.R;
          var C = step.C;
          var SIZE = step.size;
          var showGrid = step.showGrid !== false;
          var half = SIZE / 2;

          var numFlat = {};
          var startFlat = -1;
          var maxNum = 0;
          step.numbers.forEach(function (nb) {
            var f = nb.r * C + nb.c;
            numFlat[f] = nb.value;
            if (nb.value === 1) startFlat = f;
            if (nb.value > maxNum) maxNum = nb.value;
          });

          var frame = document.createElement('div');
          frame.className = 'zframe' + (showGrid ? '' : ' nogrid');
          frame.style.borderRadius = SIZE * 0.22 + 'px';

          var grid = document.createElement('div');
          grid.className = 'zgrid';
          grid.style.width = C * SIZE + 'px';
          grid.style.height = R * SIZE + 'px';
          grid.style.gridTemplateColumns = 'repeat(' + C + ',' + SIZE + 'px)';
          grid.style.gridTemplateRows = 'repeat(' + R + ',' + SIZE + 'px)';

          var cellEls = [];
          for (var i = 0; i < R * C; i++) {
            var cell = document.createElement('div');
            var cr = Math.floor(i / C);
            var cc = i % C;
            cell.className =
              'zcell' + (cc < C - 1 ? ' br' : '') + (cr < R - 1 ? ' bb' : '');
            cellEls[i] = cell;
            grid.appendChild(cell);
          }

          // Snake (SVG polyline through visited cell centres).
          var svg = document.createElementNS(SVGNS, 'svg');
          svg.setAttribute('class', 'zsnake');
          svg.setAttribute('width', C * SIZE);
          svg.setAttribute('height', R * SIZE);
          var poly = document.createElementNS(SVGNS, 'polyline');
          poly.setAttribute('stroke-width', SIZE * 0.68);
          svg.appendChild(poly);
          grid.appendChild(svg);

          // Number badges.
          var badgeEls = {};
          var radius = SIZE * 0.23;
          step.numbers.forEach(function (nb) {
            var f = nb.r * C + nb.c;
            var badge = document.createElement('div');
            badge.className = 'znum';
            badge.style.width = radius * 2 + 'px';
            badge.style.height = radius * 2 + 'px';
            badge.style.left = nb.c * SIZE + half - radius + 'px';
            badge.style.top = nb.r * SIZE + half - radius + 'px';
            badge.style.fontSize = SIZE * 0.34 + 'px';
            badge.textContent = nb.value;
            badgeEls[f] = badge;
            grid.appendChild(badge);
          });

          frame.appendChild(grid);

          var targetPath = (step.path || []).map(function (rc) {
            return rc[0] * C + rc[1];
          });
          // Demo steps with animatePath grow into targetPath; others paint it fully.
          var path = step.animatePath ? [] : targetPath.slice();

          function center(f) {
            return {
              x: (f % C) * SIZE + half,
              y: Math.floor(f / C) * SIZE + half,
            };
          }
          // drawProg (0→1) grows only the trailing segment — mirrors ZipPuzzleGrid drawProg.
          function redraw(drawProg) {
            var t = drawProg == null ? 1 : drawProg;
            var inPath = {};
            path.forEach(function (f) {
              inPath[f] = true;
            });
            for (var k = 0; k < cellEls.length; k++) {
              if (inPath[k]) cellEls[k].classList.add('on');
              else cellEls[k].classList.remove('on');
            }
            Object.keys(badgeEls).forEach(function (f) {
              if (inPath[f]) badgeEls[f].classList.add('on');
              else badgeEls[f].classList.remove('on');
            });
            if (path.length === 0) {
              poly.setAttribute('points', '');
              return;
            }
            if (path.length === 1) {
              // Hair-length segment so the round cap renders a dot.
              var p0 = center(path[0]);
              poly.setAttribute(
                'points',
                p0.x + ',' + p0.y + ' ' + p0.x + ',' + (p0.y + 0.01),
              );
              return;
            }
            var pts = [];
            for (var i = 0; i <= path.length - 2; i++) {
              var p = center(path[i]);
              pts.push(p.x + ',' + p.y);
            }
            var a = center(path[path.length - 2]);
            var b = center(path[path.length - 1]);
            pts.push(
              a.x + (b.x - a.x) * t + ',' + (a.y + (b.y - a.y) * t),
            );
            poly.setAttribute('points', pts.join(' '));
          }
          redraw();

          // One-shot auto-draw for static demo steps (order / everyCell).
          // seedPath (if set) paints immediately so step 3 continues from node 3.
          if (step.animatePath && targetPath.length > 0) {
            var animToken = pathAnimGen;
            var seedPath = (step.seedPath || []).map(function (rc) {
              return rc[0] * C + rc[1];
            });
            var startLen = seedPath.length > 0 ? seedPath.length : 1;
            path =
              seedPath.length > 0
                ? seedPath.slice()
                : [targetPath[0]];
            redraw(1);
            function growSeg(nextI) {
              if (animToken !== pathAnimGen) return;
              if (nextI >= targetPath.length) return;
              path = targetPath.slice(0, nextI + 1);
              var start = performance.now();
              function frame(now) {
                if (animToken !== pathAnimGen) return;
                var u = Math.min(1, (now - start) / ZIP_GROW_MS);
                redraw(u);
                if (u < 1) {
                  requestAnimationFrame(frame);
                } else {
                  growSeg(nextI + 1);
                }
              }
              requestAnimationFrame(frame);
            }
            if (startLen < targetPath.length) growSeg(startLen);
          }

          if (!step.interactive) return frame;

          // Wrap interactive boards so hints can sit outside the frame.
          var wrap = document.createElement('div');
          wrap.className = 'z-wrap' + (step.dragHint ? ' has-hand' : '');
          var slot = document.createElement('div');
          slot.className = 'board-slot';
          slot.appendChild(frame);
          var drag = makeDragHint(step);
          if (drag) slot.appendChild(drag.layer);
          var cellArrow = makeCellArrow(step);
          if (cellArrow) slot.appendChild(cellArrow);
          wrap.appendChild(slot);

          function hideHints() {
            if (drag) drag.hide();
            if (cellArrow) cellArrow.style.opacity = '0';
          }

          // ---- Drag-to-draw gesture ----------------------------------------
          function adjacent(a, b) {
            var ar = Math.floor(a / C);
            var ac = a % C;
            var br = Math.floor(b / C);
            var bc = b % C;
            return Math.abs(ar - br) + Math.abs(ac - bc) === 1;
          }
          function cellFromEvent(clientX, clientY) {
            var rect = grid.getBoundingClientRect();
            var x = clientX - rect.left;
            var y = clientY - rect.top;
            if (x < 0 || y < 0 || x >= C * SIZE || y >= R * SIZE) return -1;
            return Math.floor(y / SIZE) * C + Math.floor(x / SIZE);
          }
          // Mirrors useZipGesture.step: start only at "1", extend to adjacent
          // unvisited cells. On an already-visited cell — tapping (allowTrim)
          // trims the path back to it (trim-to-node); dragging only retracts the
          // last step when moving onto the immediately-previous cell (backtrack),
          // and never jump-trims to an arbitrary earlier cell.
          function step1(idx, allowTrim) {
            if (idx < 0) return;
            var before = path.length;
            if (path.length === 0) {
              if (idx !== startFlat) return;
              path = [idx];
            } else {
              var head = path[path.length - 1];
              if (idx === head) return;
              var vi = path.indexOf(idx);
              if (vi >= 0) {
                if (allowTrim || vi === path.length - 2) {
                  path = path.slice(0, vi + 1);
                }
                return;
              }
              if (adjacent(head, idx)) path.push(idx);
            }
            // Soft tick when the path grows into a new cell (mirrors usePuzzleHaptics).
            if (path.length > before) postHaptic('Soft');
          }
          function isSolved() {
            if (path.length !== R * C) return false;
            if (path[0] !== startFlat) return false;
            var expected = 1;
            for (var i = 0; i < path.length; i++) {
              var v = numFlat[path[i]];
              if (v) {
                if (v !== expected) return false;
                expected += 1;
              }
            }
            if (expected !== maxNum + 1) return false;
            return numFlat[path[path.length - 1]] === maxNum;
          }
          // Classify a failed attempt for coach error copy.
          // Priority: fill-all (incomplete board) first, then sequence.
          function failReason() {
            if (path.length === 0) return null;
            if (path.length < R * C) return 'fillAll';
            var expected = 1;
            for (var i = 0; i < path.length; i++) {
              var v = numFlat[path[i]];
              if (!v) continue;
              if (v !== expected) return 'sequence';
              expected += 1;
            }
            if (expected !== maxNum + 1) return 'sequence';
            return 'sequence';
          }
          function errorMessageFor(reason) {
            var errs = step.errors;
            if (!errs || !reason) return null;
            return errs[reason] || null;
          }
          // Win: fade grid + dark-green path redraw sweep (mirrors ZipPuzzleGrid).
          function playWinAnim(onDone) {
            frame.classList.add('zsolved');
            hideHints();
            postHaptic('Medium');
            if (path.length < 2) {
              setTimeout(onDone, ZIP_WIN_TRACE_MS);
              return;
            }
            var d = '';
            for (var i = 0; i < path.length; i++) {
              var p = center(path[i]);
              d += (i === 0 ? 'M' : 'L') + p.x + ' ' + p.y;
            }
            var winPath = document.createElementNS(SVGNS, 'path');
            winPath.setAttribute('class', 'zwin-trace');
            winPath.setAttribute('d', d);
            winPath.setAttribute('stroke-width', SIZE * 0.68);
            svg.appendChild(winPath);
            var L = 0;
            try {
              L = winPath.getTotalLength();
            } catch (err) {}
            if (L > 0) {
              winPath.style.strokeDasharray = String(L);
              winPath.style.strokeDashoffset = String(L);
              winPath.getBoundingClientRect();
              winPath.style.transition =
                'stroke-dashoffset ' + ZIP_WIN_TRACE_MS + 'ms ease';
              winPath.style.strokeDashoffset = '0';
            }
            setTimeout(onDone, Math.max(ZIP_WIN_MS, ZIP_WIN_TRACE_MS));
          }
          function checkSolved() {
            if (isSolved()) {
              interactiveDone = true;
              clearCoachWarn();
              playWinAnim(function () {
                advance();
              });
              return;
            }
            if (!step.errors) return;
            var msg = errorMessageFor(failReason());
            if (msg) flashCoachWarn(msg);
          }

          var drawing = false;
          function onDown(e) {
            if (interactiveDone) return;
            hideHints();
            drawing = true;
            try {
              grid.setPointerCapture(e.pointerId);
            } catch (err) {}
            // Initial touch = a tap until the finger moves; trim-to-node allowed.
            step1(cellFromEvent(e.clientX, e.clientY), true);
            redraw();
            e.preventDefault();
          }
          function onMove(e) {
            if (!drawing || interactiveDone) return;
            // Drag movement: draw/extend or single-step backtrack, never trim-to-node.
            step1(cellFromEvent(e.clientX, e.clientY), false);
            redraw();
            e.preventDefault();
          }
          function onUp(e) {
            if (!drawing) return;
            drawing = false;
            e.stopPropagation();
            checkSolved();
          }
          grid.addEventListener('pointerdown', onDown);
          grid.addEventListener('pointermove', onMove);
          grid.addEventListener('pointerup', onUp);
          grid.addEventListener('pointercancel', onUp);

          return wrap;
        }

        // ---- Step machine ---------------------------------------------------
        function clearAdvanceTimer() {
          if (advanceTimer) {
            clearTimeout(advanceTimer);
            advanceTimer = null;
          }
        }

        function applyStep() {
          var step = STEPS[stepIndex];
          if (!step) return;

          // Cancel any in-flight demo path grow from the previous step.
          pathAnimGen += 1;
          clearAdvanceTimer();

          clearTyping();
          clearCoachWarn();
          coachState = 'idle';
          interactiveDone = false;

          els.coach.classList.remove('is-on');
          els.coach.style.minWidth = '';
          els.coach.style.minHeight = '';
          els.coachText.textContent = '';
          els.boardHost.innerHTML = '';
          els.continue.classList.remove('is-on');

          els.coachStack.style.display = '';
          showCoachCaption(step);

          els.boardHost.appendChild(renderZip(step));

          if (step.continue) els.continue.classList.add('is-on');

          postToHost({ type: 'step', step: step.id, index: stepIndex });
        }

        function advance() {
          clearAdvanceTimer();
          stepIndex += 1;
          if (stepIndex >= STEPS.length) {
            finish();
            return;
          }
          applyStep();
        }

        function finish() {
          postToHost({ type: 'completed' });
        }

        els.continue.addEventListener('click', function (e) {
          e.stopPropagation();
          advance();
        });

        var lastTapAt = 0;
        function onScreenTap() {
          var now = Date.now();
          if (now - lastTapAt < 500) return;
          lastTapAt = now;
          handleScreenTap();
        }
        document.addEventListener('touchstart', onScreenTap, { passive: true });
        document.addEventListener('click', onScreenTap);

        window.addEventListener('message', function (e) {
          var data = e.data;
          try {
            data = typeof data === 'string' ? JSON.parse(data) : data;
          } catch (err) {
            return;
          }
          if (!data || !data.type) return;
          if (data.type === 'reset') {
            stepIndex = 0;
            applyStep();
          }
        });

        setTimeout(function () {
          lockCoachStackSize();
          applyStep();
          postToHost({ type: 'ready' });
        }, 50);
      })();
    </script>
  </body>
</html>
