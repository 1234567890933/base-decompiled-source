    <script>
      // On Android the host container already adds the top inset
      // (InteractiveHTP.native.tsx applies paddingTop when applyTopSafeArea is set).
      // Without this flag the WebView's own env(safe-area-inset-top) is added on top
      // of it and the header is pushed down twice.
      (function () {
        if (/Android/i.test(navigator.userAgent || '')) {
          document.documentElement.classList.add('is-android-webview');
        }
      })();
    </script>

    <style>
      :root {
        --bg: #171717;
        --text: #FFFFFF;
        --muted: rgba(255, 255, 255, 0.4);
        --green: #0AB963;
        --green-text: #171717;
        --coach-text: #0AB963;
        --coach-bg: #16271f;
        --board-background: #1E1E1E;
        --pink: #E24B8B;
        --blue: #4fadf5;
        --frame: #747474;
        --frame-muted: rgba(116, 116, 116, 0.5);
        --grid: #414141;
        --inactive-cell: #252525;
        --pink-fill: #41222f;
        --green-fill: #044e2a;
        --blue-fill: #1e3d52;
        --cell-size: 72px;
        --font-body:
          'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-title: 'Montserrat', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        /* The host mounts this WebView with scrollEnabled={false}, so anything that
           overflows (or a pinch-zoom) would be unreachable with no way to pan back. */
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      .stage {
        min-height: 100%;
        padding: calc(6px + env(safe-area-inset-top, 0px)) 14px
          calc(16px + env(safe-area-inset-bottom, 0px));
      }
      /* Only the top inset is double-applied — the host does not add a bottom inset,
         so that one stays. */
      html.is-android-webview .stage {
        padding-top: 6px;
      }
      .header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 60px;
      }
      .title {
        font-family: var(--font-title);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0;
        color: var(--muted);
      }
      .stage[data-step='0'] .title {
        color: var(--text);
      }
      .close-btn {
        position: absolute;
        right: -6px;
        width: 44px;
        height: 44px;
        padding: 4px 6px;
        border: 0;
        background: transparent;
        cursor: pointer;
      }
      .close-face {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 36px;
        border: 1px solid var(--frame);
        border-bottom-width: 4px;
        border-radius: 10px;
        background: var(--bg);
      }
      .close-face img {
        width: 16px;
        height: 16px;
      }
      .close-btn:active .close-face {
        transform: translateY(2px);
        border-bottom-width: 2px;
      }
      .close-btn:focus-visible,
      .fgrid:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 4px;
      }
      .content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 36px;
        margin-top: 120px;
      }
      .coach-stack {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        max-width: 280px;
        width: 100%;
        /* Reserve three lines outside the background to keep the board still. */
        min-height: calc(3 * 22px + 24px);
        flex-shrink: 0;
      }
      .coach {
        width: 100%;
        padding: 12px 16px;
        border-radius: 10px;
        color: var(--coach-text);
        background: var(--coach-bg);
        font-size: 16px;
        font-weight: 700;
        line-height: 22px;
        text-align: center;
        letter-spacing: 0;
      }
      .board-host {
        position: relative;
        width: max-content;
      }
      .fframe {
        border: 0.6px solid var(--frame-muted);
        border-radius: 9px;
        overflow: hidden;
        line-height: 0;
      }
      .fgrid {
        position: relative;
        display: grid;
        width: calc(var(--cell-size) * 4);
        height: calc(var(--cell-size) * 4);
        grid-template: repeat(4, var(--cell-size)) / repeat(4, var(--cell-size));
        touch-action: none;
        cursor: crosshair;
      }
      .fcell {
        background: var(--board-background);
        border-right: 0.6px solid var(--grid);
        border-bottom: 0.6px solid var(--grid);
        transition: background-color 280ms ease-in-out;
      }
      .fcell:nth-child(4n) {
        border-right: 0;
      }
      .fcell:nth-child(n + 13) {
        border-bottom: 0;
      }
      .fsnake {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .fsnake polyline {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .fdot {
        position: absolute;
        width: 38px;
        height: 38px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        pointer-events: none;
        transition: opacity 280ms ease-in-out;
      }
      .hint,
      .hand {
        position: absolute;
        pointer-events: none;
        z-index: 2;
      }
      .hint {
        width: 30px;
        height: 30px;
        animation: hint-pulse 1.8s ease-in-out infinite;
      }
      .hand {
        width: 53.25px;
        height: 94.28px;
        left: 20px;
        top: 65.7px;
        animation: hand-drag 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      [hidden] {
        display: none !important;
      }
      @keyframes hint-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }
      /* Reset between endpoints only while the hand is invisible. */
      @keyframes hand-drag {
        0%,
        100% {
          opacity: 0;
          transform: translateX(0);
        }
        10%,
        20% {
          opacity: 1;
          transform: translateX(0);
        }
        65%,
        75% {
          opacity: 1;
          transform: translateX(calc(var(--cell-size) * 3));
        }
        88% {
          opacity: 0;
          transform: translateX(calc(var(--cell-size) * 3));
        }
        95% {
          opacity: 0;
          transform: translateX(0);
        }
      }
      @media (max-height: 600px) {
        .content {
          margin-top: 32px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>

        function postToHost(message) {
          var payload = JSON.stringify(message);
          if (
            window.ReactNativeWebView &&
            window.ReactNativeWebView.postMessage
          ) {
            window.ReactNativeWebView.postMessage(payload);
          } else if (window.parent !== window) {
            window.parent.postMessage(payload, '*');
          }
        }
        function later(callback, delay) {
          timers.push(
            setTimeout(function () {
              if (!ended) callback();
            }, delay),
          );
        }
        function clearTimers() {
          timers.forEach(clearTimeout);
          timers = [];
        }
        function setStep(index) {
          if (ended || index === stepIndex) return;
          stepIndex = index;
          stage.dataset.step = String(index);
          if (coach.textContent !== STEPS[index].text) {
            var hadText = Boolean(coach.textContent);
            coach.textContent = STEPS[index].text;
            if (
              hadText &&
              !window.matchMedia('(prefers-reduced-motion: reduce)').matches
            ) {
              coach.getAnimations().forEach(function (animation) {
                animation.cancel();
              });
              coach.animate([{ opacity: 0.35 }, { opacity: 1 }], {
                duration: 240,
                easing: 'ease-out',
              });
            }
          }
          if (drawing) {
            // Caption wrapping must not move cells out from under a live gesture.
            boardHost.style.transform = '';
            boardHost.style.transform =
              'translateY(' +
              (gestureTop - grid.getBoundingClientRect().top) +
              'px)';
          }
          postToHost({ type: 'step', step: STEPS[index].id, index: index });
          redraw();
        }
        function center(index) {
          return {
            x: ((index % C) + 0.5) * SIZE,
            y: (Math.floor(index / C) + 0.5) * SIZE,
          };
        }
        for (var i = 0; i < 16; i++) {
          var cell = document.createElement('div');
          cell.className = 'fcell';
          cell.dataset.cell = i;
          grid.appendChild(cell);
          cells.push(cell);
        }
        // Use the existing tutorial's SVG path renderer for live pointer input.
        var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'fsnake');
        svg.setAttribute('width', C * SIZE);
        svg.setAttribute('height', C * SIZE);
        grid.appendChild(svg);
        PAIRS.forEach(function (pair, color) {
          var poly = document.createElementNS(
            'http://www.w3.org/2000/svg',
            'polyline',
          );
          poly.setAttribute('stroke', PALETTE[color]);
          poly.setAttribute('stroke-width', '22');
          svg.appendChild(poly);
          polys.push(poly);
          pair.forEach(function (index) {
            dotColorAt[index] = color;
            var point = center(index);
            var dot = document.createElement('div');
            dot.className = 'fdot';
            dot.style.left = point.x + 'px';
            dot.style.top = point.y + 'px';
            dot.style.background = PALETTE[color];
            grid.appendChild(dot);
            dots.push({ element: dot, color: color, index: index });
          });
        });
        function connected(color) {
          var path = paths[color];
          var pair = PAIRS[color];
          return (
            path.length > 1 &&
            ((path[0] === pair[0] && path[path.length - 1] === pair[1]) ||
              (path[0] === pair[1] && path[path.length - 1] === pair[0]))
          );
        }
        function nextHintCell(path) {
          var route = GUIDE_ROUTES[activeColor];
          if (path[0] === route[route.length - 1])
            route = route.slice().reverse();
          for (var i = 0; i < path.length; i++) {
            // Guide a shortcut back to the last correct turn before continuing.
            if (path[i] !== route[i]) return path[path.length - 2];
          }
          return route[Math.max(1, path.length)];
        }
        function redraw() {
          // Highlight whichever start dot is currently active, not just pink's.
          // Blue may legitimately be drawn from either endpoint, so prefer the one
          // the player actually began from and fall back to the canonical start
          // before any path exists. Already-committed paths are repainted below.
          var activeStart = paths[activeColor].length
            ? paths[activeColor][0]
            : PAIRS[activeColor][0];
          cells.forEach(function (cell, index) {
            var color = dotColorAt[index];
            var fill = '';
            if (
              color !== undefined &&
              (color <= activeColor || committed[color])
            ) {
              fill =
                index === activeStart
                  ? FILLS[activeColor]
                  : 'var(--inactive-cell)';
            }
            paths.forEach(function (path, pathColor) {
              if (committed[pathColor] && path.indexOf(index) >= 0)
                fill = FILLS[pathColor];
            });
            cell.style.backgroundColor = fill;
            cell.style.borderColor =
              index < C || fill ? 'var(--frame)' : 'var(--grid)';
          });
          paths.forEach(function (path, color) {
            polys[color].setAttribute(
              'points',
              path
                .map(function (index) {
                  var point = center(index);
                  return point.x + ',' + point.y;
                })
                .join(' '),
            );
          });
          dots.forEach(function (dot) {
            dot.element.style.opacity =
              dot.color <= activeColor || dot.index === 4 ? '1' : '0.45';
          });
          hand.hidden =
            stepIndex !== 0 || drawing || paths[0].length > 0 || ended;
          hint.hidden =
            ended ||
            (stepIndex !== 0 &&
              stepIndex !== 1 &&
              stepIndex !== 2 &&
              stepIndex !== 6);
          var path = paths[activeColor];
          var head = path.length
            ? path[path.length - 1]
            : PAIRS[activeColor][0];
          var next = nextHintCell(path);
          if (next === undefined) {
            hint.hidden = true;
          } else {
            var point = center(head);
            var dx = (next % C) - (head % C);
            var dy = Math.floor(next / C) - Math.floor(head / C);
            var angle = dx === 1 ? -90 : dx === -1 ? 90 : dy === -1 ? 180 : 0;
            hint.style.transform = 'rotate(' + angle + 'deg)';
            hint.style.left = point.x + (dx * SIZE) / 2 - 15 + 'px';
            hint.style.top = point.y + (dy * SIZE) / 2 - 15 + 'px';
          }
        }
        function cellFromEvent(event) {
          var rect = grid.getBoundingClientRect();
          var x = event.clientX - rect.left;
          var y = event.clientY - rect.top;
          if (x < 0 || y < 0 || x >= rect.width || y >= rect.height) return -1;
          return (
            Math.floor((y / rect.height) * C) * C +
            Math.floor((x / rect.width) * C)
          );
        }
        function begin(index) {
          if (ended || committed[activeColor] || index < 0) return false;
          var path = paths[activeColor];
          if (dotColorAt[index] === activeColor) {
            // The green walkthrough follows the edge, leaving room for the blue path.
            if (activeColor === 1 && index !== PAIRS[1][0]) return false;
            paths[activeColor] = [index];
          } else if (path.indexOf(index) >= 0) {
            paths[activeColor] = path.slice(0, path.indexOf(index) + 1);
          } else {
            return false;
          }
          drawing = true;
          gestureTop = grid.getBoundingClientRect().top;
          keyboardCell = index;
          updateProgress();
          redraw();
          return true;
        }
        function extend(index) {
          var path = paths[activeColor];
          if (index < 0 || index >= C * C || !drawing || !path.length || ended)
            return;
          var head = path[path.length - 1];
          if (
            Math.abs(Math.floor(head / C) - Math.floor(index / C)) +
              Math.abs((head % C) - (index % C)) !==
            1
          )
            return;
          var own = path.indexOf(index);
          if (own >= 0) {
            paths[activeColor] = path.slice(0, own + 1);
          } else {
            if (connected(activeColor)) return;
            if (
              dotColorAt[index] !== undefined &&
              dotColorAt[index] !== activeColor
            )
              return;
            if (
              paths.some(function (other, color) {
                return color !== activeColor && other.indexOf(index) >= 0;
              })
            )
              return;
            if (activeColor === 0 && index >= C) return;
            if (activeColor === 1 && index !== GREEN_ROUTE[path.length]) return;
            paths[activeColor].push(index);
          }
          keyboardCell = index;
          updateProgress();
          redraw();
        }
        function updateProgress() {
          if (activeColor !== 1 || committed[1]) return;
          if (connected(1)) setStep(3);
          else if (paths[1].length >= 3) setStep(2);
          else setStep(1);
        }
        function release(cancelled) {
          if (!drawing) return;
          drawing = false;
          pointerId = null;
          boardHost.style.transform = '';
          if (cancelled || !connected(activeColor)) {
            redraw();
            return;
          }
          if (
            activeColor === 2 &&
            paths.reduce(function (sum, path) {
              return sum + path.length;
            }, 0) !== 16
          ) {
            redraw();
            return;
          }
          committed[activeColor] = true;
          postToHost({ type: 'haptic', style: 'Light' });
          if (activeColor === 0) {
            activeColor = 1;
            keyboardCell = PAIRS[1][0];
            setStep(1);
          } else if (activeColor === 1) {
            setStep(4);
            later(function () {
              activeColor = 2;
              keyboardCell = PAIRS[2][0];
              setStep(5);
              later(function () {
                setStep(6);
              }, 500);
            }, 450);
          } else {
            ended = true;
            clearTimers();
            redraw();
            postToHost({ type: 'completed' });
          }
          redraw();
        }
        grid.addEventListener('pointerdown', function (event) {
          // A keyboard-started path sets drawing without a pointerId. Bailing out on
          // `drawing` alone would leave pointer input dead until the next Enter/Space,
          // since pointermove/up both require a matching pointerId. Let the pointer
          // take over instead; begin() re-anchors the path at the pressed cell.
          if (
            (drawing && pointerId !== null) ||
            event.isPrimary === false ||
            (event.pointerType === 'mouse' && event.button !== 0)
          )
            return;
          if (!begin(cellFromEvent(event))) return;
          pointerId = event.pointerId;
          grid.setPointerCapture(pointerId);
          event.preventDefault();
        });
        grid.addEventListener('pointermove', function (event) {
          if (!drawing || event.pointerId !== pointerId) return;
          // Some touch devices coalesce moves across multiple cells.
          var target = cellFromEvent(event);
          var path = paths[activeColor];
          var head = path[path.length - 1];
          if (
            target >= 0 &&
            (Math.floor(head / C) === Math.floor(target / C) ||
              head % C === target % C)
          ) {
            var delta =
              Math.floor(head / C) === Math.floor(target / C)
                ? Math.sign(target - head)
                : Math.sign(target - head) * C;
            while (delta && head !== target) {
              extend(head + delta);
              var next = paths[activeColor][paths[activeColor].length - 1];
              if (next === head) break;
              head = next;
            }
          } else {
            extend(target);
          }
          event.preventDefault();
        });
        grid.addEventListener('pointerup', function (event) {
          if (event.pointerId === pointerId) release(false);
        });
        grid.addEventListener('pointercancel', function (event) {
          if (event.pointerId === pointerId) release(true);
        });
        grid.addEventListener('lostpointercapture', function (event) {
          if (event.pointerId === pointerId) release(true);
        });
        grid.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            if (drawing) release(false);
            else begin(keyboardCell);
            return;
          }
          var offsets = {
            ArrowUp: -C,
            ArrowDown: C,
            ArrowLeft: -1,
            ArrowRight: 1,
          };
          if (drawing && offsets[event.key] !== undefined) {
            event.preventDefault();
            extend(keyboardCell + offsets[event.key]);
          }
        });
        document.getElementById('close').addEventListener('click', function () {
          ended = true;
          drawing = false;
          boardHost.style.transform = '';
          clearTimers();
          redraw();
          postToHost({ type: 'closed' });
        });
        function reset() {
          clearTimers();
          paths = [[], [], []];
          committed = [false, false, false];
          activeColor = 0;
          drawing = false;
          pointerId = null;
          boardHost.style.transform = '';
          ended = false;
          keyboardCell = 0;
          stepIndex = -1;
          setStep(0);
        }
        function onHostMessage(event) {
          var message = event.data;
          try {
            if (typeof message === 'string') message = JSON.parse(message);
          } catch (error) {
            return;
          }
          if (message && message.type === 'reset') reset();
        }
        window.addEventListener('message', onHostMessage);
        document.addEventListener('message', onHostMessage);
        window.addEventListener('pagehide', clearTimers);
        reset();
        postToHost({ type: 'ready' });
      })();
    </script>
  </body>
</html>
