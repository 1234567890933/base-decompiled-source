      content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"

    <title>Flip — How to Play</title>
    <script>
      (function () {
        if (/Android/i.test(navigator.userAgent || '')) {
          document.documentElement.classList.add('is-android-webview');
        }
      })();
    </script>

    <style>
      :root {
        --bg: #171717;
        --text: #FFFFFF;
        --coach-text: #0AB963;
        --coach-bg: #16271f;
        --font-body: 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, Inter, sans-serif;

        /* Flip Match palette — mirrors MEMORY_VISUALS in MemoryPuzzleQuestion/surface/visuals.ts */
        --f-back: #b3a1ff;
        --f-face: #343333;
        --f-correct: #8de7e8;
        --f-incorrect: #ff6363;
        --f-marker: #171717;

        --card: min(84px, calc((100vw - 56px) / 3));
        --gap: 10px;
        /* Half of the flip: the back squeezes shut, then the face opens. */
        --flip-half: 130ms;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        overflow: hidden;
        font-weight: 700;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      .stage {
        position: relative;
        height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        display: flex;
        flex-direction: column;
        /* Fixed top inset so coach text sits 140px from the WebView top on every step. */
        padding: 140px 18px 32px;
      }
      .content {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 26px;
        min-height: 0;
      }

      /* Coach caption */
      .coach-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 280px;
        width: 100%;
        flex-shrink: 0;
      }
      .coach {
        width: 100%;
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.35;
        color: var(--coach-text);
        background: var(--coach-bg);
        border-radius: 10px;
        padding: 12px 16px;
        opacity: 0;
        transform: translateY(4px);
        transition:
          opacity 200ms ease,
          transform 200ms ease;
      }
      .coach.is-on {
        opacity: 1;
        transform: none;
      }
      .coach-text {
        min-height: 20px;
      }
      .coach-text .word {
        display: inline-block;
        white-space: nowrap;
      }
      .coach-text .char {
        display: inline-block;
        opacity: 0;
        animation: coachCharIn 90ms ease-out forwards;
      }
      @keyframes coachCharIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* ---- Flip Match board -------------------------------------------- */
      .f-wrap {
        position: relative;
        /* Room for the tap-hand below the bottom row. */
        margin-bottom: 64px;
      }
      .f-board {
        display: grid;
        grid-template-columns: repeat(3, var(--card));
        gap: var(--gap);
      }
      .f-board.is-won {
        animation: boardWin 520ms ease-out;
      }
      @keyframes boardWin {
        0% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.05);
        }
        100% {
          transform: scale(1);
        }
      }
      .f-card {
        position: relative;
        width: var(--card);
        height: var(--card);
        padding: 0;
        border: none;
        background: transparent;
        font: inherit;
        color: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }
      .f-face {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
      }
      /* Flipping down: the face closes first, then the back opens. */
      .f-back {
        background: var(--f-back);
        transform: scaleX(1);
        transition: transform var(--flip-half) ease-out var(--flip-half);
      }
      .f-back svg {
        width: 42%;
        height: auto;
        overflow: visible;
      }
      .f-front {
        background: var(--f-face);
        transform: scaleX(0);
        transition:
          transform var(--flip-half) ease-in,
          background 160ms ease;
      }
      /* Flipping up: the back closes first, then the face opens. */
      .f-card.is-up .f-back {
        transform: scaleX(0);
        transition: transform var(--flip-half) ease-in;
      }
      .f-card.is-up .f-front {
        transform: scaleX(1);
        transition:
          transform var(--flip-half) ease-out var(--flip-half),
          background 160ms ease;
      }
      /* The opening reveal has nothing to flip from. */
      .f-board.no-anim .f-face {
        transition: none !important;
      }
      .f-emoji {
        font-size: calc(var(--card) * 0.5);
        line-height: 1;
      }
      .f-card.is-selected .f-front {
        box-shadow: inset 0 0 0 2px var(--f-correct);
      }
      .f-card.is-mismatch .f-front {
        background: var(--f-incorrect);
        animation: cardShake 260ms ease-in-out var(--flip-half);
      }
      .f-card.is-matched .f-front {
        background: var(--f-correct);
      }
      .f-check {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 160ms ease;
        pointer-events: none;
      }
      .f-card.is-matched .f-check {
        opacity: 1;
      }
      @keyframes cardShake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-4px);
        }
        75% {
          transform: translateX(4px);
        }
      }

      /* Tap hint: purple hand that taps the card to flip next. */
      .drag-hand {
        position: absolute;
        z-index: 4;
        pointer-events: none;
        opacity: 0;
        transition:
          opacity 180ms ease,
          left 260ms ease,
          top 260ms ease;
      }
      .drag-hand.is-on {
        opacity: 1;
      }
      .drag-hand-inner {
        transform-origin: 18% 0%;
        animation: handTap 1.3s ease-in-out infinite;
      }
      .drag-hand svg {
        display: block;
        width: 100%;
        height: auto;
      }
      @keyframes handTap {
        0%,
        100% {
          transform: translateY(10px) scale(1);
        }
        45%,
        60% {
          transform: translateY(0) scale(0.92);
        }
      }
    </style>

    <script>
      (function () {
        var SVGNS = 'http://www.w3.org/2000/svg';

        // Matches MEMORY_REVEAL_DURATION_MS / MEMORY_MISMATCH_DURATION_MS in the real board.
        var REVEAL_MS = 2000;
        var MISMATCH_MS = 700;
        // Both halves of the CSS flip (--flip-half × 2).
        var FLIP_MS = 260;
        var STEP_PAUSE_MS = 450;
        var WIN_MS = 700;
        var HAND_WIDTH_RATIO = 0.42;

        var EMOJI = { apple: '🍎', rocket: '🚀', star: '⭐' };
        // 2×3 deck, row-major:  🍎 🚀 ⭐ / ⭐ 🍎 🚀
        var CARDS = ['apple', 'rocket', 'star', 'star', 'apple', 'rocket'];

        // ---- Steps ----------------------------------------------------------
        // One board lives across every step. `guide` lists the only cards that
        // may be flipped, in order; a step without it is free play.
        var STEPS = [
          {
            id: 'memorise',
            reveal: true,
            text: 'Memorise the cards before they flip over.',
          },
          {
            id: 'flipOne',
            guide: [0],
            text: 'Tap a card to flip it over.',
          },
          {
            id: 'findMatch',
            guide: [4],
            text: 'Now flip its match. Matching cards stay face up.',
          },
          {
            id: 'mismatch',
            guide: [1, 2],
            text: 'Not every pair matches. Flip these two cards.',
          },
          {
            id: 'finish',
            text: 'Wrong pairs flip back. Match the rest to finish!',
          },
        ];

        var els = {
          stage: document.getElementById('stage'),
          coachStack: document.getElementById('coach-stack'),
          coach: document.getElementById('coach'),
          coachText: document.getElementById('coach-text'),
          boardHost: document.getElementById('board-host'),
          handTemplate: document.getElementById('drag-hand-template'),
        };

        var stepIndex = 0;
        var TYPE_SPEED = 15;
        var typingTimer = null;
        var coachState = 'idle';
        var timers = [];

        // Board state, rebuilt by renderBoard().
        var board = null;
        var cardEls = [];
        var hand = null;
        var matched = [];
        var firstIndex = null;
        var guidePos = 0;
        var locked = true;
        var finished = false;

        function postToHost(msg) {
          try {
            var payload = JSON.stringify(msg);
            if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
              window.ReactNativeWebView.postMessage(payload);
            } else if (window.parent && window.parent !== window) {
              window.parent.postMessage(payload, '*');
            }
          } catch (e) {}
        }

        function postHaptic(style) {
          postToHost({ type: 'haptic', style: style || 'Soft' });
        }

        function later(fn, ms) {
          var timer = setTimeout(fn, ms);
          timers.push(timer);
          return timer;
        }

        function clearTimers() {
          timers.forEach(clearTimeout);
          timers = [];
        }

        // ---- Coach typewriter ----------------------------------------------
        function clearTyping() {
          if (typingTimer) {
            clearTimeout(typingTimer);
            typingTimer = null;
          }
        }

        function typewrite(el, text, onDone) {
          clearTyping();
          coachState = 'typing';
          el.textContent = text || '';
          var totalChars = 0;
          var children = Array.prototype.slice.call(el.childNodes);
          children.forEach(function (child) {
            if (child.nodeType !== 3) return;
            var frag = document.createDocumentFragment();
            var words = child.nodeValue.split(' ');
            words.forEach(function (word, wIdx) {
              if (word.length > 0) {
                var wordSpan = document.createElement('span');
                wordSpan.className = 'word';
                for (var i = 0; i < word.length; i++) {
                  var charSpan = document.createElement('span');
                  charSpan.className = 'char';
                  charSpan.style.animationDelay = totalChars * TYPE_SPEED + 'ms';
                  charSpan.textContent = word.charAt(i);
                  wordSpan.appendChild(charSpan);
                  totalChars += 1;
                }
                frag.appendChild(wordSpan);
              }
              if (wIdx < words.length - 1) {
                frag.appendChild(document.createTextNode(' '));
                totalChars += 1;
              }
            });
            el.replaceChild(frag, child);
          });
          var done = function () {
            typingTimer = null;
            if (onDone) onDone();
          };
          if (totalChars === 0) {
            done();
            return;
          }
          typingTimer = setTimeout(done, totalChars * TYPE_SPEED + 90);
        }

        function completeTyping() {
          clearTyping();
          var step = STEPS[stepIndex];
          if (step) els.coachText.textContent = step.text || '';
          coachState = 'done';
        }

        function handleScreenTap() {
          if (coachState === 'typing') completeTyping();
        }

        function lockCoachSize(text) {
          els.coach.style.minWidth = '';
          els.coach.style.minHeight = '';
          els.coachText.textContent = text || '';
          void els.coach.offsetWidth;
          var capH = els.coach.offsetHeight || 60;
          var capW = els.coach.offsetWidth || 200;
          els.coach.style.minWidth = capW + 'px';
          els.coach.style.minHeight = capH + 'px';
          els.coachText.textContent = '';
        }

        // Reserve the tallest caption so the board never shifts between steps.
        function lockCoachStackSize() {
          var maxH = 0;
          els.coach.style.minWidth = '';
          els.coach.style.minHeight = '';
          STEPS.forEach(function (step) {
            els.coachText.textContent = step.text || '';
            void els.coachStack.offsetWidth;
            var h = els.coachStack.offsetHeight || 0;
            if (h > maxH) maxH = h;
          });
          els.coachText.textContent = '';
          els.coachStack.style.minHeight = (maxH || 64) + 'px';
        }

        function showCoachCaption(step) {
          coachState = 'idle';
          lockCoachSize(step.text);
          requestAnimationFrame(function () {
            els.coach.classList.add('is-on');
            typewrite(els.coachText, step.text, function () {
              coachState = 'done';
            });
          });
        }

        // ---- Board ------------------------------------------------------------
        function svgEl(name, attrs) {
          var el = document.createElementNS(SVGNS, name);
          Object.keys(attrs).forEach(function (key) {
            el.setAttribute(key, attrs[key]);
          });
          return el;
        }

        // Card-back mark — geometry mirrors matiksMarkGeometry.ts.
        function makeMatiksMark() {
          var svg = svgEl('svg', {
            viewBox: '0 0 13.1675 7.47141',
            fill: 'none',
            stroke: 'var(--f-marker)',
            'stroke-width': '1.58483',
            'aria-hidden': 'true',
          });
          svg.appendChild(svgEl('circle', { cx: '3.1348', cy: '3.73781', r: '2.34238' }));
          svg.appendChild(svgEl('circle', { cx: '10.0327', cy: '3.73781', r: '2.34238' }));
          svg.appendChild(
            svgEl('line', { x1: '7.56909', y1: '0.202914', x2: '5.69741', y2: '7.2685' }),
          );
          return svg;
        }

        // Matched tick — same corner and proportions as paintMemoryCard.
        function makeCheck() {
          var svg = svgEl('svg', {
            class: 'f-check',
            viewBox: '0 0 100 100',
            fill: 'none',
            stroke: 'var(--f-marker)',
            'stroke-width': '3.5',
            'aria-hidden': 'true',
          });
          svg.appendChild(svgEl('polyline', { points: '69,76 76,83 89,65' }));
          return svg;
        }

        function makeCard(index) {
          var card = document.createElement('button');
          card.type = 'button';
          card.className = 'f-card';
          card.setAttribute('data-index', String(index));

          var back = document.createElement('span');
          back.className = 'f-face f-back';
          back.appendChild(makeMatiksMark());

          var front = document.createElement('span');
          front.className = 'f-face f-front';
          var emoji = document.createElement('span');
          emoji.className = 'f-emoji';
          emoji.textContent = EMOJI[CARDS[index]];
          front.appendChild(emoji);
          front.appendChild(makeCheck());

          card.appendChild(back);
          card.appendChild(front);
          card.addEventListener('pointerdown', function (e) {
            e.preventDefault();
            onCardTap(index);
          });
          return card;
        }

        function setUp(index, isUp) {
          var card = cardEls[index];
          card.classList.toggle('is-up', isUp);
          card.setAttribute(
            'aria-label',
            'Card ' + (index + 1) + (isUp ? ', ' + CARDS[index] : ', face down'),
          );
        }

        function renderBoard() {
          els.boardHost.innerHTML = '';
          var wrap = document.createElement('div');
          wrap.className = 'f-wrap';
          board = document.createElement('div');
          board.className = 'f-board no-anim';
          board.id = 'board';
          cardEls = CARDS.map(function (_, index) {
            var card = makeCard(index);
            board.appendChild(card);
            return card;
          });
          wrap.appendChild(board);

          hand = els.handTemplate.content.firstElementChild.cloneNode(true);
          wrap.appendChild(hand);
          els.boardHost.appendChild(wrap);

          matched = CARDS.map(function () {
            return false;
          });
          firstIndex = null;
          locked = true;
          finished = false;
          // Start revealed, exactly like the real board's opening two seconds.
          CARDS.forEach(function (_, index) {
            setUp(index, true);
          });
          void board.offsetWidth;
          board.classList.remove('no-anim');
        }

        // ---- Tap hint ---------------------------------------------------------
        function pointHandAt(index) {
          var card = cardEls[index];
          var handW = card.offsetWidth * HAND_WIDTH_RATIO;
          hand.style.width = handW + 'px';
          // The fingertip sits ~18% in from the SVG's left edge.
          hand.style.left = card.offsetLeft + card.offsetWidth / 2 - handW * 0.18 + 'px';
          hand.style.top = card.offsetTop + card.offsetHeight / 2 + 'px';
          hand.classList.add('is-on');
        }

        function hideHand() {
          hand.classList.remove('is-on');
        }

        function showGuide() {
          var step = STEPS[stepIndex];
          if (step && step.guide && guidePos < step.guide.length) {
            pointHandAt(step.guide[guidePos]);
          } else {
            hideHand();
          }
        }

        // ---- Game ---------------------------------------------------------------
        function isGuideDone() {
          var step = STEPS[stepIndex];
          return Boolean(step && step.guide && guidePos >= step.guide.length);
        }

        function allMatched() {
          return matched.every(Boolean);
        }

        function win() {
          if (finished) return;
          finished = true;
          locked = true;
          board.classList.add('is-won');
          postHaptic('Medium');
          later(finish, WIN_MS);
        }

        function resolvePair(a, b) {
          cardEls[a].classList.remove('is-selected');
          if (CARDS[a] === CARDS[b]) {
            matched[a] = true;
            matched[b] = true;
            cardEls[a].classList.add('is-matched');
            cardEls[b].classList.add('is-matched');
            postHaptic('Medium');
            locked = false;
            if (allMatched()) {
              win();
            } else if (isGuideDone()) {
              later(advance, STEP_PAUSE_MS + FLIP_MS);
            }
            return;
          }
          cardEls[a].classList.add('is-mismatch');
          cardEls[b].classList.add('is-mismatch');
          postHaptic('Heavy');
          later(function () {
            [a, b].forEach(function (index) {
              cardEls[index].classList.remove('is-mismatch');
              setUp(index, false);
            });
            locked = false;
            if (isGuideDone()) later(advance, FLIP_MS);
          }, MISMATCH_MS);
        }

        function onCardTap(index) {
          var step = STEPS[stepIndex];
          if (!step || locked || finished) return;
          if (matched[index] || cardEls[index].classList.contains('is-up')) return;
          if (step.guide && step.guide[guidePos] !== index) return;

          setUp(index, true);
          postHaptic('Soft');
          if (step.guide) {
            guidePos += 1;
            showGuide();
          }

          if (firstIndex === null) {
            firstIndex = index;
            cardEls[index].classList.add('is-selected');
            if (isGuideDone()) later(advance, STEP_PAUSE_MS);
            return;
          }

          var a = firstIndex;
          firstIndex = null;
          locked = true;
          // Judge the pair once the second card has finished turning over.
          later(function () {
            resolvePair(a, index);
          }, FLIP_MS);
        }

        // ---- Step machine -------------------------------------------------------
        function startReveal() {
          locked = true;
          later(function () {
            CARDS.forEach(function (_, index) {
              setUp(index, false);
            });
            postHaptic('Soft');
            later(function () {
              locked = false;
              advance();
            }, FLIP_MS);
          }, REVEAL_MS);
        }

        function applyStep() {
          var step = STEPS[stepIndex];
          if (!step) return;

          clearTyping();
          coachState = 'idle';
          guidePos = 0;

          els.coach.classList.remove('is-on');
          els.coach.style.minWidth = '';
          els.coach.style.minHeight = '';
          els.coachText.textContent = '';
          els.stage.setAttribute('data-step', String(stepIndex));

          showCoachCaption(step);
          showGuide();
          if (step.reveal) startReveal();

          postToHost({ type: 'step', step: step.id, index: stepIndex });
        }

        function advance() {
          if (stepIndex >= STEPS.length - 1) return;
          stepIndex += 1;
          applyStep();
        }

        function finish() {
          postToHost({ type: 'completed' });
        }

        function start() {
          clearTimers();
          stepIndex = 0;
          renderBoard();
          applyStep();
        }

        var lastTapAt = 0;
        function onScreenTap() {
          var now = Date.now();
          if (now - lastTapAt < 500) return;
          lastTapAt = now;
          handleScreenTap();
        }
        document.addEventListener('touchstart', onScreenTap, { passive: true });
        document.addEventListener('click', onScreenTap);

        window.addEventListener('message', function (e) {
          var data = e.data;
          try {
            data = typeof data === 'string' ? JSON.parse(data) : data;
          } catch (err) {
            return;
          }
          if (!data || !data.type) return;
          if (data.type === 'reset') start();
        });

        setTimeout(function () {
          lockCoachStackSize();
          start();
          postToHost({ type: 'ready' });
        }, 50);
      })();
    </script>
  </body>
</html>
