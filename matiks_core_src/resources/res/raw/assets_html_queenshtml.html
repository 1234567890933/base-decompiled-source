    <style>
      :root {
        --bg: #171717;
        --text: #FFFFFF;
        --muted: rgba(255, 255, 255, 0.42);
        --green: #0AB963;
        --green-text:#171717;
        --coach-text: #0AB963;
        --coach-bg: #16271f;
        --coach-border: rgba(76, 204, 126, 0.28);
        --coach-rule: rgba(255, 255, 255, 0.55);
        --coach-warn: #ff7070;
        --pink: #de7ba5;
        --cell-line: rgba(0, 0, 0, 0.16);
        --cell-line-strong: rgba(0, 0, 0, 0.55);
        --radius: 12px;
        --font-body: 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, Inter, sans-serif;
        --font-title: 'Montserrat', 'Nunito Sans', sans-serif;

        /* Region colours (approx from the design — tweak freely) */
        --c-brown: #9c5a34;
        --c-green: #0AB963;
        --c-olive: #97883c;
        --c-blue: #4fadf5;
        --c-orange: #FF761A;
        --c-yellow: #fd0;
        --c-sky: #79b2df;
        --c-dgreen: #3b6a4f;
        --c-hatch: rgba(255, 255, 255, 0.5);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        overflow: hidden;
        font-weight: 700;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      .stage {
        position: relative;
        height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        display: flex;
        flex-direction: column;
        /* Fixed top inset so coach text sits 140px from the WebView top on every step. */
        --stage-padding-top: 140px;
        padding: var(--stage-padding-top) 18px 32px;
      }

      /* Top-aligned so the stage padding is consistent across steps (same as zip/tango). */
      .content {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 26px;
        min-height: 0;
      }

      /* Coach caption + rule line (rule sits below the green pill) */
      .coach-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 240px;
        width: 100%;
        flex-shrink: 0;
      }
      .coach {
        width: 100%;
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.35;
        color: var(--coach-text);
        background: var(--coach-bg);
        border-radius: 10px;
        padding: 12px 16px;
        opacity: 0;
        transform: translateY(4px);
        transition:
          opacity 200ms ease,
          transform 200ms ease;
      }
      .coach.is-on {
        opacity: 1;
        transform: none;
      }
      .coach-text {
        min-height: 20px;
      }
      .coach-text .hl {
        color: #FFFFFF;
        font-weight: 800;
      }

      /* Tap-hand hint over a target cell (interactive example). */
      .tap-hand {
        position: absolute;
        pointer-events: none;
        z-index: 4;
        transform: translate(-35%, 10%);
      }
      .tap-hand-inner {
        animation: handBob 800ms ease-in-out infinite alternate;
      }
      .tap-hand svg {
        display: block;
        width: 100%;
        height: auto;
      }
      @keyframes handBob {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(8px);
        }
      }
      .coach-text .word,
      .coach-sub .word {
        display: inline-block;
        white-space: nowrap;
      }
      .coach-text .char,
      .coach-sub .char {
        display: inline-block;
        opacity: 0;
        animation: coachCharIn 90ms ease-out forwards;
      }
      @keyframes coachCharIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .coach-sub {
        display: none;
        width: 100%;
        text-align: center;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.35;
        color: var(--coach-rule);
      }
      .coach-sub::before {
        content: '• ';
      }
      /* Rule-violation message swapped into the rule line. Space is reserved
         (see lockRuleSize / reserveSub) so showing it never shifts layout. */
      .coach-sub.warn {
        color: var(--coach-warn);
        font-weight: 700;
        animation: coachWarnIn 220ms ease-out;
      }
      @keyframes coachWarnIn {
        from {
          opacity: 0.25;
        }
        to {
          opacity: 1;
        }
      }
      .coach-sub.warn::before {
        content: none;
      }

      /* Single interactive cell (screens 1–3) */
      .single-cell {
        width: 66px;
        height: 66px;
        border-radius: 12px;
        background: var(--pink);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .single-cell.shake {
        animation: shake 320ms ease;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-6px);
        }
        40% {
          transform: translateX(6px);
        }
        60% {
          transform: translateX(-4px);
        }
        80% {
          transform: translateX(4px);
        }
      }

      /* Board (4×4) */
      .board {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        width: 248px;
        height: 248px;
        border-radius: 12px;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.25);
      }
      /* Solved board blob — mirrors QUEENS_BLOB_* in queensPuzzleConstants.ts */
      .board.solved-blob {
        animation: solvedBlob 500ms cubic-bezier(0.33, 0, 0.2, 1) both;
      }
      @keyframes solvedBlob {
        0% {
          transform: scale(1);
        }
        12% {
          transform: scale(1);
        }
        48% {
          transform: scale(1.09);
        }
        100% {
          transform: scale(1);
        }
      }
      .cell {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--cell-line);
        transition: opacity 160ms ease;
      }
      .cell.dim {
        opacity: 0.45;
      }
      /* Conflict hatch — diagonal white stripes over violating queen cells. */
      .cell-hatch {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          45deg,
          var(--c-hatch) 0 9px,
          transparent 9px 22px
        );
      }
      .mark-dot,
      .mark-queen {
        position: relative;
        z-index: 1;
      }
      /* Soft radial glow behind a highlighted / just-placed queen cell. */
      .cell-glow {
        position: absolute;
        inset: 8%;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.55) 0%,
          rgba(255, 255, 255, 0.18) 45%,
          transparent 72%
        );
        z-index: 0;
      }
      .cell.b-top {
        border-top: 2px solid var(--cell-line-strong);
      }
      .cell.b-bottom {
        border-bottom: 2px solid var(--cell-line-strong);
      }
      .cell.b-left {
        border-left: 2px solid var(--cell-line-strong);
      }
      .cell.b-right {
        border-right: 2px solid var(--cell-line-strong);
      }
      .mark-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #111;
      }
      .mark-dot.pop {
        animation: dotPop 340ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      @keyframes dotPop {
        from {
          transform: scale(0);
          opacity: 0;
        }
        70% {
          transform: scale(1.18);
          opacity: 1;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      .mark-queen {
        width: 60%;
        height: 60%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mark-queen svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      /* Footer continue button */
      .footer {
        flex: 0 0 auto;
        padding-top: 12px;
      }
      .btn-continue {
        width: 100%;
        height: 54px;
        border: none;
        border-radius: 12px;
        background: var(--green);
        color: var(--green-text);
        font-family: 'Nunito Sans';
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        cursor: pointer;
        display: none;
      }
      .btn-continue.is-on {
        display: block;
      }
      .btn-continue:active {
        transform: translateY(1px);
      }

      /* Board + optional side callout (e.g. "haptic when wrong"). */
      .board-wrap {
        position: relative;
        width: 248px;
        height: 248px;
      }
      .board-wrap .board {
        width: 100%;
        height: 100%;
      }
      .board-callout {
        position: absolute;
        left: 0;
        top: 28%;
        transform: translate(-50%, -50%);
        padding: 6px 10px;
        border-radius: 999px;
        background: #2c2c2c;
        color: #FFFFFF;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.2;
        white-space: nowrap;
        pointer-events: none;
        z-index: 3;
      }
      .board-callout::after {
        content: '';
        position: absolute;
        right: -5px;
        top: 50%;
        transform: translateY(-50%);
        border: 5px solid transparent;
        border-left-color: #2c2c2c;
      }
    </style>
  </head>

    <script>
      (function () {
        // ---- Crown (queen) glyph -------------------------------------------
        // Matches the queen icon used on the actual game board
        // (QUEEN_SVG_PATH in queensPuzzleConstants.ts).
        // Crown with a white silhouette outline (stroke drawn under the black fill).
        // viewBox is padded so the stroke isn't clipped when scaled into board cells.
        var CROWN_PATH =
          'M3 18V16H17V18H3ZM3 14.5L1.725 6.475C1.69167 6.475 1.65417 6.47917 1.6125 6.4875C1.57083 6.49583 1.53333 6.5 1.5 6.5C1.08333 6.5 0.729167 6.35417 0.4375 6.0625C0.145833 5.77083 0 5.41667 0 5C0 4.58333 0.145833 4.22917 0.4375 3.9375C0.729167 3.64583 1.08333 3.5 1.5 3.5C1.91667 3.5 2.27083 3.64583 2.5625 3.9375C2.85417 4.22917 3 4.58333 3 5C3 5.11667 2.9875 5.225 2.9625 5.325C2.9375 5.425 2.90833 5.51667 2.875 5.6L6 7L9.125 2.725C8.94167 2.59167 8.79167 2.41667 8.675 2.2C8.55833 1.98333 8.5 1.75 8.5 1.5C8.5 1.08333 8.64583 0.729167 8.9375 0.4375C9.22917 0.145833 9.58333 0 10 0C10.4167 0 10.7708 0.145833 11.0625 0.4375C11.3542 0.729167 11.5 1.08333 11.5 1.5C11.5 1.75 11.4417 1.98333 11.325 2.2C11.2083 2.41667 11.0583 2.59167 10.875 2.725L14 7L17.125 5.6C17.0917 5.51667 17.0625 5.425 17.0375 5.325C17.0125 5.225 17 5.11667 17 5C17 4.58333 17.1458 4.22917 17.4375 3.9375C17.7292 3.64583 18.0833 3.5 18.5 3.5C18.9167 3.5 19.2708 3.64583 19.5625 3.9375C19.8542 4.22917 20 4.58333 20 5C20 5.41667 19.8542 5.77083 19.5625 6.0625C19.2708 6.35417 18.9167 6.5 18.5 6.5C18.4667 6.5 18.4292 6.49583 18.3875 6.4875C18.3458 6.47917 18.3083 6.475 18.275 6.475L17 14.5H3Z';
        var CROWN =
          '<svg viewBox="-2 -2 24 22" xmlns="http://www.w3.org/2000/svg">' +
          '<path d="' +
          CROWN_PATH +
          '" fill="none" stroke="#FFFFFF" stroke-width="2.75" stroke-linejoin="round" stroke-linecap="round"/>' +
          '<path d="' +
          CROWN_PATH +
          '" fill="#111"/>' +
          '</svg>';

        var COLORS = {
          b: 'var(--c-brown)',
          g: 'var(--c-green)',
          o: 'var(--c-olive)',
          u: 'var(--c-blue)',
          r: 'var(--c-orange)',
          y: 'var(--c-yellow)',
          s: 'var(--c-sky)',
          d: 'var(--c-dgreen)',
        };

        // Board encoding: 4 rows, each a string of 4 tokens "<color><mark>".
        // color: b g o u r y s d   mark: - none | . dot | Q queen
        // `dim:true` fades every cell except those listed in `lit` ("row,col").

        // ---- Steps ----------------------------------------------------------
        var STEPS = [
          // 1–3: interactive single cell. `expect` is the state a correct
          // gesture must produce; wrong gestures shake + revert to `start`.
          {
            id: 'placeDot',
            mode: 'single',
            text: 'Tap a cell to place a dot and mark empty cells',
            start: 'none',
            expect: 'dot',
          },
          {
            id: 'clearCell',
            mode: 'single',
            text: 'Tap it once more to clear the cell.',
            start: 'dot',
            expect: 'none',
          },
          {
            id: 'placeQueen',
            mode: 'single',
            text: 'Double tap on empty cell to place a Queen.',
            start: 'none',
            expect: 'queen',
          },

          // 4: intro board (colours only)
          {
            id: 'rulesIntro',
            mode: 'board',
            continue: true,
            text: 'Fill the board with Queens by following three simple rules.',
            board: ['r- g- g- g-', 'r- y- u- g-', 'y- y- u- u-', 'y- y- u- u-'],
          },
          // 5: rule 1
          {
            id: 'rule1',
            mode: 'board',
            continue: true,
            text: '1. Each colored region can have only one Queen.',
            // Dim everything outside the focused green region (marks stay full opacity).
            dim: true,
            board: ['r- g. gQ g.', 'r- y- u- g.', 'y- y- u- u-', 'y- y- u- u-'],
          },
          // 6: rule 2
          {
            id: 'rule2',
            mode: 'board',
            continue: true,
            text: '2. Only one Queen in each row and column',
            // Dim unmarked cells (the unused bottom-right pocket stays disabled).
            dim: true,
            board: ['r. d. dQ d.', 'rQ y. s. g.', 'y. o- u- u-', 'y. o- u- u-'],
          },
          // 7: rule 3 — show a diagonal adjacency conflict (hatched queens).
          {
            id: 'rule3',
            mode: 'board',
            continue: true,
            text: "3. Queens can't be adjacent, not even diagonally",
            hatch: ['1,0', '2,1'],
            board: ['r. d. dQ d.', 'rQ y. u. d.', 'y. yQ u- u-', 'y. o- o- u-'],
          },
          // 8: solved board — finish cue (last two queens highlighted).
          {
            id: 'finish',
            mode: 'board',

              // Targets always bind. On queen steps, empty non-targets also bind
              // so a wrong double-tap can show the rule + haptic.
              if (targetSet[key]) bindTap(br, bc, true);
              else if (expect === 'queen' && state[br][bc] === 'none') bindTap(br, bc, false);
            }
          }

          return root;
        }

        // ---- Single interactive cell ---------------------------------------
        var cellState = 'none';
        var tapTimer = null;

        function renderSingle(step) {
          cellState = step.start;
          var cell = document.createElement('div');
          cell.className = 'single-cell';
          var m = markEl(cellState);
          if (m) cell.appendChild(m);

          function paint() {
            cell.innerHTML = '';
            var mm = markEl(cellState);
            if (mm) cell.appendChild(mm);
          }
          function fail() {
            cell.classList.remove('shake');
            // reflow to restart the animation
            void cell.offsetWidth;
            cell.classList.add('shake');
            setTimeout(function () {
              cellState = step.start;
              paint();
            }, 360);
          }
          function succeed() {
            scheduleAdvance();
          }
          function apply(isDouble) {
            if (isDouble) {
              cellState = 'queen';
            } else {
              cellState = cellState === 'none' ? 'dot' : 'none';
            }
            paint();
            if (cellState === step.expect) succeed();
            else fail();
          }
          // Distinguish single vs double tap with a short window.
          cell.addEventListener('click', function () {
            if (tapTimer) {
              clearTimeout(tapTimer);
              tapTimer = null;
              apply(true);
              return;
            }
            tapTimer = setTimeout(function () {
              tapTimer = null;
              apply(false);
            }, 260);
          });
          return cell;
        }

        // ---- Step machine ---------------------------------------------------
        function applyStepLayout(step) {
          var top =
            typeof step.stagePaddingTop === 'number'
              ? step.stagePaddingTop + 'px'
              : '140px';
          els.stage.style.setProperty('--stage-padding-top', top);
        }

        function applyStep() {
          var step = STEPS[stepIndex];
          if (!step) return;

          clearAdvanceTimer();
          clearAutoPopTimers();
          clearTyping();
          coachState = 'idle';
          tapAnywhereActive = false;
          interactiveDone = false;
          applyStepLayout(step);
          if (warnTimer) {
            clearTimeout(warnTimer);
            warnTimer = null;
          }
          warnBoardRevert = null;
          els.coachSub.classList.remove('warn');

          els.coach.classList.remove('is-on');
          els.coach.style.minWidth = '';
          els.coach.style.minHeight = '';
          els.coachText.textContent = '';
          els.coachSub.textContent = '';
          els.coachSub.style.display = 'none';
          els.coachSub.style.minHeight = '';
          els.boardHost.innerHTML = '';
          els.continue.classList.remove('is-on');

          els.coachStack.style.display = '';
          showCoachCaption(step);

          var node = null;
          if (step.mode === 'single') node = renderSingle(step);
          else if (step.mode === 'board') node = renderBoard(step);
          else if (step.mode === 'interactive') node = renderInteractive(step);
          if (node) els.boardHost.appendChild(node);

          if (step.mode === 'interactive' && step.interaction === 'tapAnywhere') {
            tapAnywhereActive = true;
          }

          if (step.continue) els.continue.classList.add('is-on');

          postToHost({ type: 'step', step: step.id, index: stepIndex });
        }

        function advance() {
          stepIndex += 1;
          if (stepIndex >= STEPS.length) {
            finish();
            return;
          }
          applyStep();
        }

        function finish() {
          postToHost({ type: 'completed' });
        }

        els.continue.addEventListener('click', function (e) {
          // Don't let the click bubble to the document tap handler — otherwise
          // it would immediately fire the next step's tap-anywhere advance.
          e.stopPropagation();
          advance();
        });

        var lastTapAt = 0;
        function onScreenTap() {
          var now = Date.now();
          if (now - lastTapAt < 500) return;
          lastTapAt = now;
          if (tapAnywhereActive) {
            tapAnywhereActive = false;
            advance();
            return;
          }
          handleScreenTap();
        }
        document.addEventListener('touchstart', onScreenTap, { passive: true });
        document.addEventListener('click', onScreenTap);

        window.addEventListener('message', function (e) {
          var data = e.data;
          try {
            data = typeof data === 'string' ? JSON.parse(data) : data;
          } catch (err) {
            return;
          }
          if (!data || !data.type) return;
          if (data.type === 'reset') {
            stepIndex = 0;
            applyStep();
          }
        });

        setTimeout(function () {
          lockCoachStackSize();
          applyStep();
          postToHost({ type: 'ready' });
        }, 50);
      })();
    </script>
  </body>
</html>
