    <style>
      :root {
        --bg: #171717;
        --text: #FFFFFF;
        --muted: rgba(255, 255, 255, 0.42);
        --coach-text: #0AB963;
        --coach-bg: #16271f;
        --font-body:
          'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Inter, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        overflow: hidden;
        font-weight: 700;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      .stage {
        position: relative;
        height: 100%;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        display: flex;
        flex-direction: column;
        /* Default top inset; last step overrides via --stage-padding-top. */
        --stage-padding-top: 140px;
        padding: var(--stage-padding-top) 18px 32px;
      }

      /* Top-aligned so the stage padding is consistent across steps (same as zip/tango). */
      .content {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 26px;
        min-height: 0;
      }

      /* Coach caption */
      .coach-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 280px;
        width: 100%;
        flex-shrink: 0;
      }
      .coach {
        width: 100%;
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.35;
        color: var(--coach-text);
        background: var(--coach-bg);
        border-radius: 10px;
        padding: 12px 16px;
        opacity: 0;
        transform: translateY(4px);
        transition:
          opacity 200ms ease,
          transform 200ms ease;
      }
      .coach.is-on {
        opacity: 1;
        transform: none;
      }
      .coach-text {
        min-height: 20px;
      }
      .coach-text .word {
        display: inline-block;
        white-space: nowrap;
      }
      .coach-text .char {
        display: inline-block;
        opacity: 0;
        animation: coachCharIn 90ms ease-out forwards;
      }
      @keyframes coachCharIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Reference art above the caption on the final step only.
         Must not reserve space when off (visibility:hidden still occupies layout —
         that was pushing the coach ~80px below zip/tango). */
      .reference {
        flex-shrink: 0;
        width: 74px;
        height: 80px;
        display: none;
        pointer-events: none;
      }
      .reference.is-on {
        display: block;
      }

      /* Pipes float on the page — no board frame / grid lines. */
      .pipes-wrap {
        position: relative;
        touch-action: manipulation;
        transition: transform 200ms ease;
      }
      .pipes-wrap svg {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
      }

      /* Tap hint: a finger that bobs below the tile it wants rotated, gliding between tiles.
         The outer element owns the position so the bob on the inner one is never overwritten. */
      .tap-hand {
        position: absolute;
        z-index: 1;
        pointer-events: none;
        transition:
          left 240ms ease,
          top 240ms ease;
      }
      .tap-hand-inner {
        animation: handBob 800ms ease-in-out infinite alternate;
      }
      .tap-hand svg {
        display: block;
        width: 100%;
        height: auto;
      }
      @keyframes handBob {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(var(--hand-bob, 12px));
        }
      }
    </style>

        // pipesPuzzleConstants.ts — the how-to-play boards are a few big tiles rather than a full
        // grid, so the design scales the tube and the hub up. Bulb and hub diameters are both kept
        // at 2× the tube width, as they are in game.
        var RATIOS = {

          bulbRadius: 0.35,
          sourceRadius: 0.35,
          sourceHole: 0.155,

        // sits just below and slightly right of the tile centre and bobs towards it.
        var HAND = {

          leftRatio: 0.065, // left edge, back from the tile centre
          topRatio: 0.4, // resting top, below the tile centre
          bobRatio: 0.26, // distance the bob travels

        // ---- Steps ----------------------------------------------------------
        // All interactive (tap a tile to rotate it 90° CW). Step 1 just teaches
        // the gesture; steps 2–3 advance once everything is connected to the

        var STEPS = [
          {

            text: 'Tap the pipe to rotate it.',
            R: 1,
            C: 1,
            size: 92,
            source: 0,
            advanceOnTap: true,

            size: 72,

            tiles: [8, 10, 2], // solution: [2,10,8]
            hintTiles: [0, 2], // finger works left to right, one bulb at a time
          },
          {
            id: 'puzzle',
            text: 'All the pipes should be connected back to the source to complete the puzzle',
            R: 3,
            C: 3,
            size: 76,
            source: 4,

            tiles: [2, 4, 8, 14, 15, 3, 2, 3, 1],
            reference: true, // the shape to aim for, drawn above the caption

        // ---- Coach typewriter ----------------------------------------------
        function clearTyping() {

            clearTimeout(typingTimer);

        function typewrite(el, text, onDone) {
          clearTyping();
          coachState = 'typing';
          el.textContent = text || '';
          var totalChars = 0;
          var children = Array.prototype.slice.call(el.childNodes);
          children.forEach(function (child) {
            if (child.nodeType !== 3) return;
            var frag = document.createDocumentFragment();
            var words = child.nodeValue.split(' ');
            words.forEach(function (word, wIdx) {
              if (word.length > 0) {
                var wordSpan = document.createElement('span');
                wordSpan.className = 'word';
                for (var i = 0; i < word.length; i++) {
                  var charSpan = document.createElement('span');
                  charSpan.className = 'char';

                    totalChars * TYPE_SPEED + 'ms';
                  charSpan.textContent = word.charAt(i);

                  totalChars += 1;

                frag.appendChild(wordSpan);

            typingTimer = null;

        function lockCoachSize(text) {

          els.coach.style.minHeight = '';

          void els.coach.offsetWidth;
          var capH = els.coach.offsetHeight || 60;
          var capW = els.coach.offsetWidth || 200;
          els.coach.style.minWidth = capW + 'px';
          els.coach.style.minHeight = capH + 'px';

        }
        function measureCoachStackHeight(text) {

          els.coach.style.minHeight = '';

        // ---- Pipes logic ---------------------------------------------------
        function rotateCW(m) {
          return ((m << 1) | (m >> 3)) & 0xf;
        }
        // Flood fill from the source through matched edges (mirrors computeGreen).
        function computeGreen(masks, R, C, source) {
          var empty = { set: {}, flood: [], count: 0 };
          if (source < 0 || masks[source] === 0) return empty;
          var visited = {};
          visited[source] = true;
          var queue = [source];
          var count = 1;
          var flood = []; // BFS-ordered [idx, side, ...] arms (source outward)
          for (var qi = 0; qi < queue.length; qi++) {
            var idx = queue[qi];
            var m = masks[idx];
            var r = Math.floor(idx / C);
            var c = idx % C;
            for (var s = 0; s < 4; s++) {
              if (!(m & (1 << s))) continue;
              flood.push(idx, s); // every arm of a connected tile gets filled
              var nr = r + DR[s];
              var nc = c + DC[s];
              if (nr < 0 || nr >= R || nc < 0 || nc >= C) continue;
              var nb = nr * C + nc;
              if (masks[nb] === 0 || !(masks[nb] & (1 << ((s + 2) % 4))))
                continue;
              if (!visited[nb]) {
                visited[nb] = true;
                count += 1;
                queue.push(nb);
              }
            }
          }
          if (count < 2) return empty; // a lone source reads as not connected
          return { set: visited, flood: flood, count: count };
        }
        // Solved when every opening is matched and the graph is `networks` trees.
        function isSolved(masks, R, C, networks) {
          var total = R * C;
          var parent = [];
          for (var i = 0; i < total; i++) parent[i] = i;
          function find(x) {
            var root = x;
            while (parent[root] !== root) root = parent[root];
            while (parent[x] !== root) {
              var nx = parent[x];
              parent[x] = root;
              x = nx;
            }
            return root;
          }
          var vertices = 0;
          var openings = 0;
          for (var idx = 0; idx < total; idx++) {
            var m = masks[idx];
            if (m === 0) continue;
            vertices += 1;
            var r = Math.floor(idx / C);
            var c = idx % C;
            for (var s = 0; s < 4; s++) {
              if (!(m & (1 << s))) continue;
              var nr = r + DR[s];
              var nc = c + DC[s];
              if (nr < 0 || nr >= R || nc < 0 || nc >= C) return false;
              var nb = nr * C + nc;
              if (masks[nb] === 0) return false;
              if (!(masks[nb] & (1 << ((s + 2) % 4)))) return false;
              openings += 1;
              parent[find(idx)] = find(nb);
            }
          }
          if (openings / 2 !== vertices - networks) return false;
          var comps = 0;
          for (var k = 0; k < total; k++) {
            if (masks[k] !== 0 && find(k) === k) comps += 1;
          }
          return comps === networks;
        }

        // ---- Pipe rendering (mirrors PipesPuzzleGrid + pipesUtils) ----
        function isStraightPipeMask(m) {
          return m === 5 || m === 10;

        function tubeHalfWidth(tubeWidth) {

        function straightPipeRect(m, cx, cy, cellSize, tubeWidth) {

          if (m === 10)
            return { x: cx - half, y: cy - hw, w: cellSize, h: tubeWidth };
          return null;
        }
        function sourceArmRect(side, cx, cy, half, srcR, tubeWidth) {
          var hw = tubeHalfWidth(tubeWidth);
          var armLen = half - srcR;
          if (side === 0)
            return { x: cx - hw, y: cy - half, w: tubeWidth, h: armLen };
          if (side === 1)
            return { x: cx + srcR, y: cy - hw, w: armLen, h: tubeWidth };
          if (side === 2)
            return { x: cx - hw, y: cy + srcR, w: tubeWidth, h: armLen };
          return { x: cx - half, y: cy - hw, w: armLen, h: tubeWidth };
        }
        function rectPathD(r) {
          return (
            'M' + r.x + ' ' + r.y + 'h' + r.w + 'v' + r.h + 'h' + -r.w + 'Z'
          );
        }
        function circlePathD(cx, cy, r) {
          return (
            'M' +
            (cx + r) +
            ' ' +
            cy +
            'A' +
            r +
            ' ' +
            r +
            ' 0 1 1 ' +
            (cx - r) +
            ' ' +
            cy +
            'A' +
            r +
            ' ' +
            r +
            ' 0 1 1 ' +
            (cx + r) +
            ' ' +
            cy
          );
        }
        function buildSourceNodePathD(mask, cx, cy, cellSize) {
          var half = cellSize / 2;
          var srcR = cellSize * 0.2;
          var armW = srcR * 2 * 0.65;
          var d = circlePathD(cx, cy, srcR);
          for (var side = 0; side < 4; side++) {
            if (!(mask & (1 << side))) continue;
            d += rectPathD(sourceArmRect(side, cx, cy, half, srcR, armW));
          }
          return d;
        }
        // Centreline for one tile. `ext` pushes wall endpoints past the cell edge so neighbouring
        // fill strokes overlap (mirrors addTileArms in PipesPuzzleGrid).
        function tileArmD(m, cx, cy, h, ext) {
          var reach = h + (ext || 0);
          function ex(s) {
            return cx + (s === 1 ? reach : s === 3 ? -reach : 0);
          }
          function ey(s) {
            return cy + (s === 0 ? -reach : s === 2 ? reach : 0);
          }
          var d = '';
          function through(a, b) {
            d +=
              'M' +
              ex(a) +
              ' ' +
              ey(a) +
              'L' +
              cx +
              ' ' +
              cy +
              'L' +
              ex(b) +
              ' ' +
              ey(b);
          }
          function stub(s) {
            d += 'M' + cx + ' ' + cy + 'L' + ex(s) + ' ' + ey(s);
          }
          var sides = [];
          for (var s = 0; s < 4; s++) if (m & (1 << s)) sides.push(s);
          if (sides.length === 1) stub(sides[0]);
          else if (sides.length === 2) through(sides[0], sides[1]);
          else if (sides.length === 3) {
            if (m & 1 && m & 4) {
              through(0, 2);
              stub(m & 2 ? 1 : 3);
            } else {
              through(1, 3);
              stub(m & 1 ? 0 : 2);
            }
          } else if (sides.length === 4) {
            through(0, 2);
            through(1, 3);
          }
          return d;
        }

        function buildPipes(masks, R, C, SIZE, source, prevGreen) {
          var half = SIZE / 2;
          var WALL = 1.125;
          var outerW = SIZE * RATIOS.pipeWidth;
          var innerW = Math.max(1, outerW - 2 * WALL);
          var bulbR = SIZE * RATIOS.bulbRadius;
          var holeR = Math.max(1, bulbR - WALL);
          var srcR = SIZE * RATIOS.sourceRadius;
          var srcHole = SIZE * RATIOS.sourceHole;

          var g = computeGreen(masks, R, C, source);
          var green = g.set;
          var whiteArms = '';
          var srcWhiteArms = '';
          var srcGreenArms = '';
          var greenArms = '';
          var straightWhiteOuter = [];
          var straightWhiteInner = [];
          var straightGreenOuter = [];
          var whiteDiscs = [];
          var greenBulbs = [];
          var whiteHoles = [];
          var greenHoles = [];
          var donut = null;

          for (var idx = 0; idx < masks.length; idx++) {
            var m = masks[idx];
            if (m === 0) continue;
            var cx = (idx % C) * SIZE + half;
            var cy = Math.floor(idx / C) * SIZE + half;
            var isGreen = !!green[idx];
            var pop = 0;
            for (var b = 0; b < 4; b++) if (m & (1 << b)) pop += 1;
            if (idx === source) {
              if (isGreen) srcGreenArms += tileArmD(m, cx, cy, half);
              else srcWhiteArms += tileArmD(m, cx, cy, half);

            } else if (isStraightPipeMask(m)) {
              if (isGreen) {
                straightGreenOuter.push(
                  straightPipeRect(m, cx, cy, SIZE, outerW),
                );
              } else {
                straightWhiteOuter.push(
                  straightPipeRect(m, cx, cy, SIZE, outerW),
                );
                straightWhiteInner.push(
                  straightPipeRect(m, cx, cy, SIZE, innerW),
                );
              }
            } else if (isGreen) {
              greenArms += tileArmD(m, cx, cy, half);
              if (pop === 1) {
                greenBulbs.push([cx, cy]);
                greenHoles.push([cx, cy]);
              }
            } else {
              whiteArms += tileArmD(m, cx, cy, half);

                whiteHoles.push([cx, cy]);
              }
            }

          var svg = document.createElementNS(SVGNS, 'svg');
          svg.setAttribute('width', C * SIZE);
          svg.setAttribute('height', R * SIZE);

          function addPath(d, color, w, linecap) {
            if (!d) return;
            var p = document.createElementNS(SVGNS, 'path');
            p.setAttribute('d', d);
            p.setAttribute('fill', 'none');
            p.setAttribute('stroke', color);
            p.setAttribute('stroke-width', w);
            p.setAttribute('stroke-linecap', linecap || 'butt');
            p.setAttribute('stroke-linejoin', 'round');
            svg.appendChild(p);
          }

            if (!d) return;
            var p = document.createElementNS(SVGNS, 'path');
            p.setAttribute('d', d);
            p.setAttribute('fill', fill);
            if (stroke) {
              p.setAttribute('stroke', stroke);
              p.setAttribute('stroke-width', strokeW);
            }
            svg.appendChild(p);

          function addRects(list, fill, stroke, strokeW) {
            list.forEach(function (r) {
              if (!r) return;
              var rect = document.createElementNS(SVGNS, 'rect');
              rect.setAttribute('x', r.x);
              rect.setAttribute('y', r.y);
              rect.setAttribute('width', r.w);
              rect.setAttribute('height', r.h);
              rect.setAttribute('fill', fill);
              if (stroke) {
                rect.setAttribute('stroke', stroke);
                rect.setAttribute('stroke-width', strokeW);
              }
              svg.appendChild(rect);
            });
          }
          function addCircles(list, color, r) {
            list.forEach(function (pt) {
              var c = document.createElementNS(SVGNS, 'circle');
              c.setAttribute('cx', pt[0]);
              c.setAttribute('cy', pt[1]);
              c.setAttribute('r', r);
              c.setAttribute('fill', color);
              svg.appendChild(c);
            });
          }
          function addCircle(cx, cy, r, fill, stroke, strokeW) {
            var c = document.createElementNS(SVGNS, 'circle');
            c.setAttribute('cx', cx);
            c.setAttribute('cy', cy);
            c.setAttribute('r', r);
            c.setAttribute('fill', fill);
            if (stroke) {
              c.setAttribute('stroke', stroke);
              c.setAttribute('stroke-width', strokeW);
            }
            svg.appendChild(c);
          }

          // 1) outer silhouettes
          addRects(straightWhiteOuter, COL.wall);
          addRects(straightGreenOuter, COL.fill, COL.fillBorder, WALL * 2);
          addPath(whiteArms, COL.wall, outerW, 'butt');
          addPath(srcWhiteArms, COL.wall, outerW, 'butt');
          addPath(srcGreenArms, COL.fill, outerW, 'butt');
          addPath(greenArms, COL.fillBorder, outerW, 'butt');
          addCircles(whiteDiscs, COL.wall, bulbR);
          addCircles(greenBulbs, COL.fillBorder, bulbR);
          if (donut) {
            addCircles(
              [[donut.cx, donut.cy]],
              donut.green ? COL.fill : COL.wall,
              srcR,
            );
          }

          // 2) carve channels
          addRects(straightWhiteInner, COL.page);
          addPath(whiteArms, COL.page, innerW, 'butt');
          addCircles(whiteHoles, COL.page, holeR);
          addCircles(greenHoles, COL.fill, holeR);

          // Group every tile's arms into ONE joined centreline (tileArmD) — separate

          // Split into already-green (static) vs newly-green (swept in) so prior tiles
          // don't blink dark when a new connection arrives.

          var newFillD = '';
          var fi = 0;
          while (fi + 1 < g.flood.length) {

            if (!d) return null;

            fp.setAttribute('fill', 'none');
            fp.setAttribute('stroke', COL.fill);
            fp.setAttribute('stroke-width', innerW);
            fp.setAttribute('stroke-linecap', 'butt');

        }

        // ---- Pipes step ----------------------------------------------------
        function renderPipes(step) {
          interactiveDone = false;
          var R = step.R;
          var C = step.C;
          var SIZE = step.size;
          var source = step.source;
          var networks = step.networks || 1;
          var masks = step.tiles.slice();

          var wrap = document.createElement('div');
          wrap.className = 'pipes-wrap';
          wrap.style.width = C * SIZE + 'px';
          wrap.style.height = R * SIZE + 'px';

          // Tap hint: a finger bobbing under the first tile in `hintTiles` that has not reached the
          // source yet. It stays put however many turns that tile needs, slides to the next one as
          // each connects, and leaves once they all have.
          var half = SIZE / 2;
          var hintTiles = step.hintTiles || [];
          var hand = null;
          if (hintTiles.length) {
            hand = els.handTemplate.content.firstElementChild.cloneNode(true);
            hand.style.width = SIZE * HAND.widthRatio + 'px';
            hand.style.setProperty('--hand-bob', SIZE * HAND.bobRatio + 'px');
            pointHandAt(hintTiles[0]);
            wrap.appendChild(hand);
          }
          function pointHandAt(tile) {
            var cx = (tile % C) * SIZE + half;
            var cy = Math.floor(tile / C) * SIZE + half;
            hand.style.left = cx - SIZE * HAND.leftRatio + 'px';
            hand.style.top = cy + SIZE * HAND.topRatio + 'px';

          function updateHint(greenSet) {
            if (!hand) return;
            for (var i = 0; i < hintTiles.length; i++) {

              }

          var prevCount = -1;
          var prevGreenSet = null;
          var currentSvg = null;
          function rebuild() {
            var built = buildPipes(masks, R, C, SIZE, source, prevGreenSet);
            // Swap just the board, so the hand keeps its place in the DOM and can transition
            // between tiles instead of jumping.
            if (currentSvg) wrap.removeChild(currentSvg);
            currentSvg = built.svg;
            wrap.appendChild(currentSvg);
            updateHint(built.greenSet);
            // Only the newly-connected arms sweep in; the already-green fill is drawn solid, so
            // connected pipes never blink out on a new connection.
            var fp = built.fillPathNew;
            if (fp) {
              var L = 0;
              try {
                L = fp.getTotalLength();
              } catch (e) {}
              if (L > 0) {

                // connected region grows (snap instantly otherwise).
                var grew = prevCount >= 0 && built.count > prevCount;
                fp.style.strokeDasharray = L;
                fp.style.transition = 'none';
                fp.style.strokeDashoffset = grew ? L : '0';

                  fp.style.transition = 'stroke-dashoffset 240ms ease';
                  fp.style.strokeDashoffset = '0';

            prevGreenSet = built.greenSet;

          function cellFromEvent(clientX, clientY) {
            var rect = wrap.getBoundingClientRect();
            var x = clientX - rect.left;
            var y = clientY - rect.top;

            return Math.floor(y / SIZE) * C + Math.floor(x / SIZE);

            if (interactiveDone) return;
            e.stopPropagation();
            var idx = cellFromEvent(e.clientX, e.clientY);
            if (idx < 0 || masks[idx] === 0) return;
            masks[idx] = rotateCW(masks[idx]);
            rebuild();
            if (step.advanceOnTap) {
              interactiveDone = true;
              advance();
              return;
            }
            if (isSolved(masks, R, C, networks)) {
              interactiveDone = true;
              advance();
            }
          });

          return wrap;
        }

        // ---- Step machine ---------------------------------------------------
        function applyStepLayout(step) {
          var top =
            typeof step.stagePaddingTop === 'number'
              ? step.stagePaddingTop + 'px'
              : '140px';
          els.stage.style.setProperty('--stage-padding-top', top);
        }

        function applyStep() {
          var step = STEPS[stepIndex];
          if (!step) return;

          clearTyping();
          clearAdvanceTimer();
          coachState = 'idle';
          interactiveDone = false;
          applyStepLayout(step);

          els.reference.classList.toggle('is-on', !!step.reference);
          els.coach.classList.remove('is-on');
          els.coach.style.minWidth = '';
          els.coach.style.minHeight = '';
          els.coachText.textContent = '';
          els.boardHost.innerHTML = '';

          els.coachStack.style.display = '';
          showCoachCaption(step);

          els.boardHost.appendChild(renderPipes(step));

          postToHost({ type: 'step', step: step.id, index: stepIndex });
        }

        function advance() {
          clearAdvanceTimer();
          // The host already pauses before its completion modal, so only step→step swaps need to
          // hold here — long enough for the tap's rotation to read before the board changes.
          if (stepIndex >= STEPS.length - 1) {
            finish();
            return;
          }
          advanceTimer = setTimeout(function () {
            advanceTimer = null;
            stepIndex += 1;
            applyStep();
          }, STEP_ADVANCE_DELAY_MS);
        }

        function finish() {
          postToHost({ type: 'completed' });
        }

        var lastTapAt = 0;
        function onScreenTap() {
          var now = Date.now();
          if (now - lastTapAt < 500) return;
          lastTapAt = now;
          handleScreenTap();
        }
        document.addEventListener('touchstart', onScreenTap, { passive: true });
        document.addEventListener('click', onScreenTap);

        window.addEventListener('message', function (e) {
          var data = e.data;
          try {
            data = typeof data === 'string' ? JSON.parse(data) : data;
          } catch (err) {
            return;
          }
          if (!data || !data.type) return;
          if (data.type === 'reset') {
            stepIndex = 0;
            applyStep();
          }
        });

        setTimeout(function () {
          lockCoachStackSize();
          applyStep();
          postToHost({ type: 'ready' });
        }, 50);
      })();
    </script>
  </body>
</html>
